# MuxCore MVP — pull prebuilt GHCR images (future public mirror; no sibling Go builds).
# Requires published images under ghcr.io/muxcore-media/* (see scripts/publish-muxcored-ghcr.sh).
# Primary non-dev path today: docker-compose.registry.yml + scripts/publish-muxcored-local.sh
# (Forgejo / LAN; no write:packages). See docs/PUBLIC-INSTALL.md.
#
# Usage (from this directory):
#   export MUXCORE_IMAGE_TAG=v0.5.7   # or latest published tag
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#   ./smoke.sh
#
# Prefer ./run-host.sh when developing from sibling clones.

name: muxcore-mvp-ghcr

x-image: &image
  image: ghcr.io/muxcore-media/${MUXCORE_SERVICE:-muxcored}:${MUXCORE_IMAGE_TAG:-v0.5.7}
  restart: unless-stopped
  networks: [muxcore]
  environment: &module_env
    MUXCORE_GRPC_ADDR: core:9090
    MUXCORE_INSECURE_DISABLE_TLS: "true"
    MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}

services:
  core:
    image: ghcr.io/muxcore-media/muxcored:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      MUXCORE_CONFIG: /app/muxcore.json
      MUXCORE_SERVER_ADDR: ":8080"
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}
      MUXCORE_STORAGE_DIR: /app/data/storage
    ports:
      - "${MUXCORE_HTTP_PORT:-8080}:8080"
      - "${MUXCORE_GRPC_PORT:-9090}:9090"
    volumes:
      - core-data:/app/data
      - ./muxcore.json:/app/muxcore.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [muxcore]

  api-rest:
    <<: *image
    image: ghcr.io/muxcore-media/api-rest:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: api-rest
      API_REST_HTTP_ADDR: ":8080"
      API_REST_GRPC_ADDR: ":9400"
    ports:
      - "${API_REST_HTTP_PORT:-18080}:8080"
      - "${API_REST_GRPC_PORT:-9400}:9400"
    depends_on:
      core:
        condition: service_healthy

  auth-local:
    <<: *image
    image: ghcr.io/muxcore-media/auth-local:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: auth-local
      AUTH_DB_PATH: /data/auth.db
      AUTH_GRPC_ADDR: ":9403"
      AUTH_HTTP_ADDR: ":9401"
    ports:
      - "${AUTH_LOCAL_PORT:-9403}:9403"
      - "${AUTH_HTTP_PORT:-9401}:9401"
    volumes:
      - auth-data:/data
    depends_on:
      core:
        condition: service_healthy

  database-sqlite:
    <<: *image
    image: ghcr.io/muxcore-media/database-sqlite:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: database-sqlite
    volumes:
      - sqlite-data:/data
    depends_on:
      core:
        condition: service_healthy

  admin-ui:
    <<: *image
    image: ghcr.io/muxcore-media/admin-ui:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: admin-ui
      ADMIN_UI_ADDR: ":8082"
      ADMIN_UI_AUTH_ADDR: http://auth-local:9401
    ports:
      - "${ADMIN_UI_HTTP_PORT:-8082}:8082"
    depends_on:
      core:
        condition: service_healthy
      auth-local:
        condition: service_started

  media-movies:
    <<: *image
    image: ghcr.io/muxcore-media/media-movies:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-movies
    depends_on:
      core:
        condition: service_healthy

  media-tvshows:
    <<: *image
    image: ghcr.io/muxcore-media/media-tvshows:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-tvshows
    depends_on:
      core:
        condition: service_healthy

  media-automation:
    <<: *image
    image: ghcr.io/muxcore-media/media-automation:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-automation
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      AUTOMATION_DOWNLOAD_DIR: /data/downloads
      MVP_DOWNLOADS_DIR: /data/downloads
    volumes:
      - downloads:/data/downloads
    depends_on:
      core:
        condition: service_healthy

  media-scanner:
    <<: *image
    image: ghcr.io/muxcore-media/media-scanner:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-scanner
      SCANNER_LIBRARY_ROOT: /data/movies
      SCANNER_TV_LIBRARY_ROOT: /data/shows
    volumes:
      - downloads:/data/downloads
      - movies:/data/movies
      - shows:/data/shows
    depends_on:
      core:
        condition: service_healthy

  request-media:
    <<: *image
    image: ghcr.io/muxcore-media/request-media:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: request-media
      REQUEST_REQUIRE_APPROVAL: ${REQUEST_REQUIRE_APPROVAL:-false}
    depends_on:
      core:
        condition: service_healthy

  jellyfin-bridge:
    <<: *image
    image: ghcr.io/muxcore-media/jellyfin:${MUXCORE_IMAGE_TAG:-v0.5.7}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: jellyfin
      JELLYFIN_BASE_URL: ${JELLYFIN_BASE_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      USERDATA_SYNC: ${USERDATA_SYNC:-0}
      USERDATA_SYNC_INTERVAL_SECONDS: ${USERDATA_SYNC_INTERVAL_SECONDS:-300}
      USERDATA_LOCAL_URL: ${USERDATA_LOCAL_URL:-}
      USERDATA_PUSH_TO_JELLYFIN: ${USERDATA_PUSH_TO_JELLYFIN:-0}
    depends_on:
      core:
        condition: service_healthy

networks:
  muxcore:

volumes:
  core-data:
  auth-data:
  sqlite-data:
  downloads:
  movies:
  shows:
