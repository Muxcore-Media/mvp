# MuxCore MVP — pull prebuilt images from an OCI registry (no sibling Go builds).
# Default is a LAN registry (local-registry.sh); no GHCR write:packages required.
# See scripts/publish-muxcored-local.sh and docs/PUBLIC-INSTALL.md (ADR-0007).
#
# Usage (from this directory):
#   export MUXCORE_REGISTRY=localhost:5000/muxcore          # or ghcr.io/muxcore-media once published
#   export MUXCORE_IMAGE_TAG=v0.6.13
#   export DOWNLOADER_ENGINE=fixture
#   docker compose -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.registry.yml up -d
#   ./scripts/smoke-registry.sh    # no host Go / sibling clones (or ./smoke.sh auto-detects)
#
# Publish muxcored (build host with sibling GitHub checkouts):
#   MUXCORE_REGISTRY=… ./scripts/publish-muxcored-local.sh v0.6.13
# Module images must be tagged under the same MUXCORE_REGISTRY prefix.
#
# Prefer ./run-host.sh when developing from sibling clones.
# GHCR: the same file with MUXCORE_REGISTRY=ghcr.io/muxcore-media once images are
# published there (needs a write:packages token; not yet available).

name: muxcore-mvp-registry

x-image: &image
  image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/${MUXCORE_SERVICE:-muxcored}:${MUXCORE_IMAGE_TAG:-v0.6.13}
  restart: unless-stopped
  networks: [muxcore]
  environment: &module_env
    MUXCORE_GRPC_ADDR: core:9090
    MUXCORE_INSECURE_DISABLE_TLS: "true"
    MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}

services:
  core:
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/muxcored:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      MUXCORE_CONFIG: /app/muxcore.json
      MUXCORE_SERVER_ADDR: ":8080"
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}
      MUXCORE_STORAGE_DIR: /app/data/storage
    ports:
      - "${MUXCORE_HTTP_PORT:-8080}:8080"
      - "${MUXCORE_GRPC_PORT:-9090}:9090"
    volumes:
      - core-data:/app/data
      - ./muxcore.json:/app/muxcore.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [muxcore]

  api-rest:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/api-rest:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: api-rest
      API_REST_HTTP_ADDR: ":8080"
      API_REST_GRPC_ADDR: ":9400"
    ports:
      - "${API_REST_HTTP_PORT:-18080}:8080"
      - "${API_REST_GRPC_PORT:-9400}:9400"
    depends_on:
      core:
        condition: service_healthy

  auth-local:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/auth-local:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: auth-local
      AUTH_DB_PATH: /data/auth.db
      AUTH_GRPC_ADDR: ":9403"
      AUTH_HTTP_ADDR: ":9401"
      AUTH_BOOTSTRAP_USER: ${MVP_ADMIN_USER:-admin}
      AUTH_BOOTSTRAP_PASSWORD: ${MVP_ADMIN_PASSWORD:?set MVP_ADMIN_PASSWORD in .env (openssl rand -hex 16)}
    ports:
      - "${AUTH_LOCAL_PORT:-9403}:9403"
      - "${AUTH_HTTP_PORT:-9401}:9401"
    volumes:
      - auth-data:/data
    depends_on:
      core:
        condition: service_healthy

  # Optional OIDC SSO auth — compose profile: auth-oidc
  #   docker compose -f docker-compose.registry.yml --profile auth-oidc up -d
  # run-host equivalent: MVP_ENABLE_AUTH_OIDC=1
  # Swap-in for auth-local only — do not run both in the same mesh (duplicate AuthProvider).
  # Soft-empty when AUTH_OIDC_ISSUER / client / redirect unset (Health unhealthy, login 503).
  auth-oidc:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/auth-oidc:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: auth-oidc
      AUTH_OIDC_GRPC_ADDR: ":9410"
      AUTH_OIDC_HTTP_ADDR: ":9412"
      AUTH_OIDC_DB_PATH: /data/auth-oidc/auth.db
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_REDIRECT_URL: ${AUTH_OIDC_REDIRECT_URL:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid profile email}
      AUTH_OIDC_ROLE_MAP: ${AUTH_OIDC_ROLE_MAP:-}
      AUTH_OIDC_ROLES_CLAIM: ${AUTH_OIDC_ROLES_CLAIM:-groups}
      AUTH_OIDC_DEFAULT_ROLES: ${AUTH_OIDC_DEFAULT_ROLES:-user}
      AUTH_OIDC_SESSION_TTL: ${AUTH_OIDC_SESSION_TTL:-24h}
      AUTH_ALLOWED_REDIRECT_HOSTS: ${AUTH_ALLOWED_REDIRECT_HOSTS:-}
      ADMIN_UI_PUBLIC_URL: ${ADMIN_UI_PUBLIC_URL:-}
      MEDIA_UI_PUBLIC_URL: ${MEDIA_UI_PUBLIC_URL:-}
    ports:
      - "${AUTH_OIDC_GRPC_PORT:-9410}:9410"
      - "${AUTH_OIDC_HTTP_PORT:-9412}:9412"
    volumes:
      - auth-oidc-data:/data
    depends_on:
      core:
        condition: service_healthy
    profiles: ["auth-oidc"]

  # Optional process-local in-memory cache layer — compose profile: cache-local
  #   docker compose -f docker-compose.registry.yml --profile cache-local up -d
  # run-host equivalent: MVP_ENABLE_CACHE_LOCAL=1
  # In-memory only — no durable volume; entries lost on restart.
  cache-local:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/cache-local:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: cache-local
      CACHE_LOCAL_GRPC_ADDR: ":9602"
    ports:
      - "${CACHE_LOCAL_GRPC_PORT:-9602}:9602"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["cache-local"]

  database-sqlite:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/database-sqlite:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: database-sqlite
      SQLITE_DB_PATH: /data/muxcore.db
    volumes:
      - sqlite-data:/data
    depends_on:
      core:
        condition: service_healthy

  secrets-file:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/secrets-file:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: secrets-file
      SECRETS_STORE: /data/secrets.json
      # Required (64 hex chars, e.g. `openssl rand -hex 32`). Keep it OUTSIDE the
      # backup archive (operator .env / password manager): a restored secrets.json
      # is unreadable without it. Unset = fail closed at Init (ADR-0013).
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-}
    volumes:
      - secrets-file-data:/data
    depends_on:
      core:
        condition: service_healthy

  # Optional Vault/OpenBao/cloud secrets sidecar — compose profile: secrets-vault
  #   docker compose -f docker-compose.registry.yml --profile secrets-vault up -d
  # run-host equivalent: MVP_ENABLE_SECRETS_VAULT=1
  # Mutually exclusive with secrets-file (both advertise capability "secrets").
  # Fail-closed: module Init() refuses to start without SECRETS_BACKEND + provider env.
  secrets-vault:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/secrets-vault:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: secrets-vault
      SECRETS_GRPC_ADDR: ":9551"
      SECRETS_BACKEND: ${SECRETS_BACKEND:-}
      SECRETS_PREFIX: ${SECRETS_PREFIX:-muxcore/}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL:-}
    ports:
      - "${SECRETS_VAULT_GRPC_PORT:-9551}:9551"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["secrets-vault"]

  encryption-aesgcm:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/encryption-aesgcm:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: encryption-aesgcm
      # Keyring is generated on first start. Key material: not in the backup
      # archive (household-manifest excluded_volumes); export it separately.
      ENCRYPTION_KEY_FILE: /data/master.key
    volumes:
      - encryption-aesgcm-data:/data
    depends_on:
      core:
        condition: service_healthy

  call-policy-default:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/call-policy-default:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: call-policy-default
    depends_on:
      core:
        condition: service_healthy

  publish-policy-default:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/publish-policy-default:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: publish-policy-default
    depends_on:
      core:
        condition: service_healthy

  health-monitor:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/health-monitor:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: health-monitor
      # Off-loopback HTTP needs a bearer token (NFR-SEC-011); admin-ui sends it.
      HEALTH_MONITOR_HTTP_ADDR: "0.0.0.0:9203"
      HEALTH_MONITOR_HTTP_TOKEN: ${HEALTH_MONITOR_HTTP_TOKEN:?set HEALTH_MONITOR_HTTP_TOKEN in .env (openssl rand -hex 32)}
    depends_on:
      core:
        condition: service_healthy

  admin-ui:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/admin-ui:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: admin-ui
      ADMIN_UI_ADDR: ":8082"
      ADMIN_UI_AUTH_ADDR: http://auth-local:9401
      ADMIN_UI_DATA_DIR: /data
      # Shared with media-ui consumer POST /api/password-reset (umbrella #111).
      ADMIN_UI_PASSWORD_RESET_FILE: /data/media-ui/password-resets.json
      ADMIN_UI_HEALTH_MONITOR_URL: ${ADMIN_UI_HEALTH_MONITOR_URL:-http://health-monitor:9203}
      ADMIN_UI_HEALTH_MONITOR_TOKEN: ${HEALTH_MONITOR_HTTP_TOKEN:?set HEALTH_MONITOR_HTTP_TOKEN in .env (openssl rand -hex 32)}
      # Restore allow-list root; matches the BFF/backup-local BACKUP_RESTORE_DIR.
      ADMIN_UI_RESTORE_ROOT: /data/restore
    ports:
      - "${ADMIN_UI_HTTP_PORT:-8082}:8082"
    volumes:
      - admin-ui-data:/data
      - media-ui-data:/data/media-ui
    depends_on:
      core:
        condition: service_healthy
      auth-local:
        condition: service_started

  media-movies:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-movies:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-movies
      MOVIES_DB_PATH: /data/movies.db
      MOVIES_IMAGE_DIR: /data/images
      # Insecure dev mode rewrites ":port" binds to loopback; bind the service
      # name so the media-ui BFF can reach gRPC across containers.
      MOVIES_GRPC_ADDR: media-movies:9420
      MOVIES_HTTP_ADDR: ":9430"
    volumes:
      - media-movies-data:/data
      # Library (scanner import target) read-only for /stream.
      - movies:/data/movies:ro
    depends_on:
      core:
        condition: service_healthy

  media-tvshows:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-tvshows:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-tvshows
      TVSHOWS_DB_PATH: /data/tvshows.db
      TVSHOWS_IMAGE_DIR: /data/images
      TVSHOWS_GRPC_ADDR: ":9440"
      TVSHOWS_HTTP_ADDR: ":9450"
    volumes:
      - media-tvshows-data:/data
      # Library (scanner import target) read-only for /stream/tv.
      - shows:/data/shows:ro
    depends_on:
      core:
        condition: service_healthy

  media-automation:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-automation:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-automation
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      AUTOMATION_DB_PATH: /data/automation.db
      AUTOMATION_DOWNLOAD_DIR: /data/downloads
      MVP_DOWNLOADS_DIR: /data/downloads
    volumes:
      - media-automation-data:/data
      - downloads:/data/downloads
    depends_on:
      core:
        condition: service_healthy

  # Optional acquisition downloaders — compose profiles (off by default; not in Path A stack).
  # run-host equivalents: MVP_ENABLE_DOWNLOADER_*=1 (see .env.example).
  #   docker compose -f docker-compose.registry.yml --profile downloader-torrent up -d
  downloader-native-torrent:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/downloader-native-torrent:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-native-torrent
      DOWNLOADER_GRPC_ADDR: ":9461"
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      DOWNLOAD_DIR: /data/downloads
      # Payloads land on the shared `downloads` volume that media-automation and
      # media-scanner mount. Mesh mode (storage:// URIs) breaks the fixture engine,
      # which writes the URI as a relative directory.
      DOWNLOAD_STORAGE: ${DOWNLOAD_STORAGE:-local}
      MUXCORE_HTTP_ADDR: ":9464"
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
      NAT_PMP_PORT: ${NAT_PMP_PORT:-0}
    ports:
      - "${DOWNLOADER_TORRENT_GRPC_PORT:-9461}:9461"
      - "${DOWNLOADER_TORRENT_HTTP_PORT:-9464}:9464"
    volumes:
      - downloads:/data/downloads
    depends_on:
      core:
        condition: service_healthy
    profiles: ["downloader-torrent"]

  downloader-qbittorrent:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/downloader-qbittorrent:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-qbittorrent
      QBIT_GRPC_ADDR: ":9462"
      QBIT_HTTP_ADDR: ":9463"
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      QBIT_FIXTURE: ${QBIT_FIXTURE:-1}
      QBIT_URL: ${QBIT_URL:-}
      QBIT_USERNAME: ${QBIT_USERNAME:-}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
    ports:
      - "${DOWNLOADER_QBIT_GRPC_PORT:-9462}:9462"
      - "${DOWNLOADER_QBIT_HTTP_PORT:-9463}:9463"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["downloader-qbittorrent"]

  downloader-native-usenet:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/downloader-native-usenet:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-native-usenet
      USENET_GRPC_ADDR: ":9622"
      MUXCORE_HTTP_ADDR: ":9623"
      USENET_ENGINE: ${USENET_ENGINE:-fixture}
      USENET_DOWNLOAD_DIR: /data/downloads/usenet
      USENET_PAR2: ${USENET_PAR2:-auto}
      USENET_UNPACK: ${USENET_UNPACK:-auto}
      NNTP_HOST: ${NNTP_HOST:-}
      NNTP_PORT: ${NNTP_PORT:-}
      NNTP_USER: ${NNTP_USER:-}
      NNTP_PASS: ${NNTP_PASS:-}
      NNTP_SSL: ${NNTP_SSL:-}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
    ports:
      - "${DOWNLOADER_USENET_GRPC_PORT:-9622}:9622"
      - "${DOWNLOADER_USENET_HTTP_PORT:-9623}:9623"
    volumes:
      - downloads:/data/downloads
    depends_on:
      core:
        condition: service_healthy
    profiles: ["downloader-usenet"]

  downloader-sabnzbd:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/downloader-sabnzbd:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-sabnzbd
      MUXCORE_GRPC_ADDR_OVERRIDE: ":9620"
      MUXCORE_HTTP_ADDR: ":9621"
      SABNZBD_URL: ${SABNZBD_URL:-}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
    ports:
      - "${DOWNLOADER_SABNZBD_GRPC_PORT:-9620}:9620"
      - "${DOWNLOADER_SABNZBD_HTTP_PORT:-9621}:9621"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["downloader-sabnzbd"]

  # HTTP defaults to loopback 127.0.0.1:9631 (soft-empty; no DEBRID_HTTP_TOKEN).
  # Open host HTTP: set MUXCORE_HTTP_ADDR=0.0.0.0:9631, DEBRID_HTTP_TOKEN, and publish :9631.
  downloader-debrid:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/downloader-debrid:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-debrid
      DEBRID_PROVIDER: ${DEBRID_PROVIDER:-}
      DEBRID_TOKEN: ${DEBRID_TOKEN:-}
      REAL_DEBRID_TOKEN: ${REAL_DEBRID_TOKEN:-}
      DEBRID_API_BASE: ${DEBRID_API_BASE:-}
      DEBRID_HTTP_TOKEN: ${DEBRID_HTTP_TOKEN:-}
    ports:
      - "${DOWNLOADER_DEBRID_GRPC_PORT:-9630}:9630"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["downloader-debrid"]

  # Optional acquisition indexers — compose profiles (off by default; not in Path A stack).
  # run-host equivalents: MVP_ENABLE_INDEXER_*=1 (see .env.example).
  #   docker compose -f docker-compose.registry.yml --profile indexer-piratebay up -d
  indexer-piratebay:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/indexer-piratebay:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: indexer-piratebay
      PIRATEBAY_GRPC_ADDR: ":9485"
      PIRATEBAY_HTTP_ADDR: ":9487"
      INDEXER_FIXTURE: ${INDEXER_FIXTURE:-1}
      PIRATEBAY_API_BASE: ${PIRATEBAY_API_BASE:-}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
    ports:
      - "${INDEXER_PIRATEBAY_GRPC_PORT:-9485}:9485"
      - "${INDEXER_PIRATEBAY_HTTP_PORT:-9487}:9487"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["indexer-piratebay"]

  indexer-torznab:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/indexer-torznab:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: indexer-torznab
      TORZNAB_GRPC_ADDR: ":9486"
      TORZNAB_URL: ${TORZNAB_URL:-}
      TORZNAB_API_KEY: ${TORZNAB_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
    ports:
      - "${INDEXER_TORZNAB_GRPC_PORT:-9486}:9486"
    depends_on:
      core:
        condition: service_healthy
    profiles: ["indexer-torznab"]

  media-scanner:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-scanner:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-scanner
      SCANNER_DB_PATH: /data/scanner.db
      SCANNER_LIBRARY_ROOT: /data/movies
      SCANNER_TV_LIBRARY_ROOT: /data/shows
    volumes:
      - media-scanner-data:/data
      - downloads:/data/downloads
      - movies:/data/movies
      - shows:/data/shows
    depends_on:
      core:
        condition: service_healthy

  request-media:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/request-media:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: request-media
      # HTTP on all container interfaces (not published) so the media-ui BFF can
      # reach it; gRPC binds the service name (insecure mode rewrites ":port").
      REQUEST_HTTP_ADDR: ":9380"
      REQUEST_GRPC_ADDR: request-media:9481
      REQUEST_DATA_DIR: /data
      REQUEST_REQUIRE_APPROVAL: ${REQUEST_REQUIRE_APPROVAL:-false}
    volumes:
      - request-media-data:/data
    depends_on:
      core:
        condition: service_healthy

  metadata-tmdb:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/metadata-tmdb:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: metadata-tmdb
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    depends_on:
      core:
        condition: service_healthy

  media-custom-formats:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-custom-formats:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-custom-formats
      FORMATS_DB_PATH: /data/formats.db
      FORMATS_SEED_DEFAULTS: "true"
      FORMATS_TRASH_SYNC: "${FORMATS_TRASH_SYNC:-true}"
      FORMATS_TRASH_IMPORT_PROFILES: "${FORMATS_TRASH_IMPORT_PROFILES:-true}"
      FORMATS_TRASH_SCORE_SET: "${FORMATS_TRASH_SCORE_SET:-default}"
      FORMATS_TRASH_SERVICES: "${FORMATS_TRASH_SERVICES:-radarr,sonarr}"
    volumes:
      - media-custom-formats-data:/data
    depends_on:
      core:
        condition: service_healthy

  media-rename:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-rename:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-rename
      RENAME_DB_PATH: /data/rename.db
      RENAME_GRPC_ADDR: ":9510"
    volumes:
      - media-rename-data:/data
    depends_on:
      core:
        condition: service_healthy

  media-ffprobe:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-ffprobe:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-ffprobe
      FFPROBE_DB_PATH: /data/cache.db
    volumes:
      - media-ffprobe-data:/data
    depends_on:
      core:
        condition: service_healthy

  media-subtitles:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-subtitles:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-subtitles
      SUBS_DB_PATH: /data/subtitles.db
      SUBS_DIR: /data/files
    volumes:
      - media-subtitles-data:/data
    depends_on:
      core:
        condition: service_healthy

  media-root-folders:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-root-folders:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-root-folders
      ROOTS_DB_PATH: /data/roots.db
    volumes:
      - media-root-folders-data:/data
      # AddRootFolder stats/lists the path and reports free space, so the
      # libraries it registers must exist in this container (read-only is enough).
      - movies:/data/movies:ro
      - shows:/data/shows:ro
    depends_on:
      core:
        condition: service_healthy

  notification-default:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/notification-default:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: notification-default
      # Insecure dev mode rewrites ":port" binds to loopback; bind the service
      # name so the media-ui BFF (NOTIFY_GRPC_CLIENT_ADDR) can reach gRPC.
      NOTIFY_GRPC_ADDR: notification-default:9441
      WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-http://127.0.0.1:9/muxcore-notify-sink}
    depends_on:
      core:
        condition: service_healthy

  # Household userdata mesh — tip module reads USERDATA_LOCAL_DB_PATH (+ HTTP/gRPC addrs) only.
  userdata-local:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/userdata-local:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: userdata-local
      USERDATA_LOCAL_HTTP_ADDR: ":9672"
      USERDATA_LOCAL_GRPC_ADDR: ":9673"
      USERDATA_LOCAL_DB_PATH: /data/userdata.db
    ports:
      - "${USERDATA_LOCAL_PORT:-9672}:9672"
    volumes:
      - userdata-data:/data
    depends_on:
      core:
        condition: service_healthy

  # Optional household backup — profile: backup-local
  #   docker compose -f docker-compose.registry.yml --profile backup-local up -d
  # State model (ADR-0013): every backed-up `state:` volume in household-manifest.yaml
  # is mounted read-only at /source/<module-id> and listed in the default
  # BACKUP_SOURCE_DIRS (scripts/check-state-coverage.sh enforces both). Library media
  # (movies/shows/downloads) and key material (encryption-aesgcm, SECRETS_MASTER_KEY)
  # are deliberately excluded. Stop writers before a backup for a consistent archive.
  backup-local:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/backup-local:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: backup-local
      BACKUP_DIR: /data/backups
      BACKUP_GRPC_ADDR: ":9302"
      BACKUP_GRPC_BIND_ALL: "true"
      BACKUP_SOURCE_DIRS: ${BACKUP_SOURCE_DIRS:-/source/core,/source/auth-local,/source/database-sqlite,/source/secrets-file,/source/admin-ui,/source/media-movies,/source/media-tvshows,/source/media-scanner,/source/media-automation,/source/request-media,/source/userdata-local,/source/media-ui,/source/media-custom-formats,/source/media-rename,/source/media-ffprobe,/source/media-subtitles,/source/media-root-folders,/source/auth-oidc,/source/playback-guard,/source/playback-monitor,/source/media-dlna,/source/media-tagging,/source/media-intro-outro,/source/media-transcoder-pool,/source/jellyfin,/source/plex,/source/emby}
      BACKUP_SCHEDULE_CRON: ${BACKUP_SCHEDULE_CRON:-}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-0}
    volumes:
      - backup-data:/data/backups
      - backup-restore-data:/data/restore
      - core-data:/source/core:ro
      - auth-data:/source/auth-local:ro
      - sqlite-data:/source/database-sqlite:ro
      - secrets-file-data:/source/secrets-file:ro
      - admin-ui-data:/source/admin-ui:ro
      - media-movies-data:/source/media-movies:ro
      - media-tvshows-data:/source/media-tvshows:ro
      - media-scanner-data:/source/media-scanner:ro
      - media-automation-data:/source/media-automation:ro
      - request-media-data:/source/request-media:ro
      - userdata-data:/source/userdata-local:ro
      - media-ui-data:/source/media-ui:ro
      - media-custom-formats-data:/source/media-custom-formats:ro
      - media-rename-data:/source/media-rename:ro
      - media-ffprobe-data:/source/media-ffprobe:ro
      - media-subtitles-data:/source/media-subtitles:ro
      - media-root-folders-data:/source/media-root-folders:ro
      - auth-oidc-data:/source/auth-oidc:ro
      - playback-guard-data:/source/playback-guard:ro
      - playback-monitor-data:/source/playback-monitor:ro
      - dlna-data:/source/media-dlna:ro
      - tagging-data:/source/media-tagging:ro
      - intro-outro-data:/source/media-intro-outro:ro
      - transcoder-pool-data:/source/media-transcoder-pool:ro
      - jellyfin-data:/source/jellyfin:ro
      - plex-data:/source/plex:ro
      - emby-data:/source/emby:ro
    depends_on:
      core:
        condition: service_healthy
      auth-local:
        condition: service_started
      database-sqlite:
        condition: service_started
      userdata-local:
        condition: service_started
    profiles: ["backup-local"]

  # Optional DLNA/UPnP media server — compose profile: dlna
  #   docker compose -f docker-compose.registry.yml --profile dlna up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_DLNA=1
  media-dlna:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-dlna:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-dlna
      DLNA_GRPC_ADDR: ":9751"
      DLNA_HEALTH_HTTP_ADDR: ":8751"
      DLNA_HTTP_ADDR: ":9750"
      DLNA_MEDIA_PATH: ${DLNA_MEDIA_PATH:-/data/movies}
      DLNA_FRIENDLY_NAME: ${DLNA_FRIENDLY_NAME:-MuxCore DLNA}
      DLNA_PROBE_CACHE_PATH: /data/dlna/ffprobe-cache.json
    ports:
      - "${MEDIA_DLNA_HTTP_PORT:-9750}:9750"
      - "${MEDIA_DLNA_GRPC_PORT:-9751}:9751"
      - "${MEDIA_DLNA_HEALTH_PORT:-8751}:8751"
    volumes:
      - dlna-data:/data/dlna
      - movies:/data/movies:ro
      - shows:/data/shows:ro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["dlna"]

  # Optional content tagging / classification — compose profile: tagging
  #   docker compose -f docker-compose.registry.yml --profile tagging up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_TAGGING=1
  media-tagging:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-tagging:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-tagging
      TAGGING_DATA_DIR: /data/tagging
      TAGGING_GRPC_ADDR: ":9740"
      MUXCORE_HTTP_ADDR: ":9741"
    ports:
      - "${MEDIA_TAGGING_GRPC_PORT:-9740}:9740"
      - "${MEDIA_TAGGING_HTTP_PORT:-9741}:9741"
    volumes:
      - tagging-data:/data/tagging
    depends_on:
      core:
        condition: service_healthy
    profiles: ["tagging"]

  # Optional intro/outro skip detection — compose profile: intro-outro
  #   docker compose -f docker-compose.registry.yml --profile intro-outro up -d
  # run-host starts this with media UI unless MVP_ENABLE_MEDIA_INTRO_OUTRO=0
  media-intro-outro:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-intro-outro:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-intro-outro
      INTRO_OUTRO_DATA_DIR: /data/intro-outro
      MUXCORE_HTTP_ADDR: ":9711"
      INTRO_MAX_SECONDS: ${INTRO_MAX_SECONDS:-180}
      OUTRO_MAX_SECONDS: ${OUTRO_MAX_SECONDS:-240}
    ports:
      - "${MEDIA_INTRO_OUTRO_GRPC_PORT:-9710}:9710"
      - "${MEDIA_INTRO_OUTRO_HTTP_PORT:-9711}:9711"
    volumes:
      - intro-outro-data:/data/intro-outro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["intro-outro"]

  # Optional playback policy enforcement — compose profile: playback-guard
  #   docker compose -f docker-compose.registry.yml --profile playback-guard up -d
  # run-host equivalent: MVP_ENABLE_PLAYBACK_GUARD=1
  playback-guard:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/playback-guard:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: playback-guard
      PLAYBACK_GUARD_GRPC_ADDR: ":9561"
      PLAYBACK_GUARD_DB_PATH: /data/playback-guard/guard.db
    ports:
      - "${PLAYBACK_GUARD_GRPC_PORT:-9561}:9561"
    volumes:
      - playback-guard-data:/data/playback-guard
    depends_on:
      core:
        condition: service_healthy
    profiles: ["playback-guard"]

  # Optional playback session monitor — compose profile: playback-monitor
  #   docker compose -f docker-compose.registry.yml --profile playback-monitor up -d
  # run-host: default-on with media-ui (MVP_ENABLE_PLAYBACK_MONITOR=0 to disable)
  playback-monitor:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/playback-monitor:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: playback-monitor
      PLAYBACK_MONITOR_GRPC_ADDR: ":9560"
      PLAYBACK_MONITOR_HTTP_ADDR: ":8560"
      PLAYBACK_MONITOR_DB_PATH: /data/playback-monitor/monitor.db
      PLAYBACK_MONITOR_HTTP_TOKEN: ${PLAYBACK_MONITOR_HTTP_TOKEN:-}
    ports:
      - "${PLAYBACK_MONITOR_GRPC_PORT:-9560}:9560"
      - "${PLAYBACK_MONITOR_HTTP_PORT:-8560}:8560"
    volumes:
      - playback-monitor-data:/data/playback-monitor
    depends_on:
      core:
        condition: service_healthy
    profiles: ["playback-monitor"]

  # Optional transcoder worker pool — compose profile: transcoder-pool
  #   docker compose -f docker-compose.registry.yml --profile transcoder-pool up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_TRANSCODER_POOL=1
  # Soft-empty: coordinator runs without workers; dispatch no-ops until workers register.
  media-transcoder-pool:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-transcoder-pool:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-transcoder-pool
      POOL_DB_PATH: /data/transcoder-pool/pool.db
      MUXCORE_HTTP_ADDR: ":9721"
      POOL_STALE_AFTER_SEC: ${POOL_STALE_AFTER_SEC:-60}
      POOL_DISPATCH: ${POOL_DISPATCH:-}
      POOL_DISPATCH_TIMEOUT_SEC: ${POOL_DISPATCH_TIMEOUT_SEC:-}
    ports:
      - "${TRANSCODER_POOL_GRPC_PORT:-9720}:9720"
      - "${TRANSCODER_POOL_HTTP_PORT:-9721}:9721"
    volumes:
      - transcoder-pool-data:/data/transcoder-pool
    depends_on:
      core:
        condition: service_healthy
    profiles: ["transcoder-pool"]

  media-ui:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-ui:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-ui
      MEDIA_UI_LISTEN: ":5173"
      MEDIA_UI_REQUIRE_AUTH: "1"
      AUTH_HTTP_INTERNAL_URL: http://auth-local:9401
      USERDATA_LOCAL_URL: http://userdata-local:9672
      AUTOMATION_GRPC_CLIENT_ADDR: media-automation:9460
      SCANNER_GRPC_CLIENT_ADDR: media-scanner:9470
      FORMATS_GRPC_CLIENT_ADDR: media-custom-formats:9490
      MUSIC_GRPC_CLIENT_ADDR: media-music:9640
      NOTIFY_GRPC_CLIENT_ADDR: notification-default:9441
      BACKUP_GRPC_CLIENT_ADDR: backup-local:9302
      MAINTAINER_GRPC_CLIENT_ADDR: media-library-maintainer:9545
      PLAYBACK_GUARD_GRPC_CLIENT_ADDR: playback-guard:9561
      TAGGING_HTTP_URL: http://media-tagging:9741
      BACKUP_RESTORE_DIR: /data/restore
      PLAYBACK_MONITOR_HTTP_URL: http://playback-monitor:8560
      PLAYBACK_MONITOR_HTTP_TOKEN: ${PLAYBACK_MONITOR_HTTP_TOKEN:-}
      INDEXER_PIRATEBAY_HTTP_URL: http://indexer-piratebay:9487
      INDEXER_TORZNAB_GRPC_CLIENT_ADDR: indexer-torznab:9486
      DOWNLOADER_TORRENT_HTTP_URL: http://downloader-native-torrent:9464
      DOWNLOADER_QBIT_HTTP_URL: http://downloader-qbittorrent:9463
      DOWNLOADER_SAB_HTTP_URL: http://downloader-sabnzbd:9621
      DOWNLOADER_USENET_HTTP_URL: http://downloader-native-usenet:9623
      DEBRID_HTTP_URL: http://downloader-debrid:9631
      # Library + recommended peers (container DNS, not the 127.0.0.1 defaults).
      MOVIES_GRPC_CLIENT_ADDR: media-movies:9420
      TVSHOWS_GRPC_CLIENT_ADDR: media-tvshows:9440
      MOVIES_HTTP_URL: http://media-movies:9430
      TVSHOWS_HTTP_URL: http://media-tvshows:9450
      REQUEST_MEDIA_HTTP_URL: http://request-media:9380
      ROOTS_GRPC_CLIENT_ADDR: media-root-folders:9540
      RENAME_GRPC_CLIENT_ADDR: media-rename:9510
      FFPROBE_GRPC_CLIENT_ADDR: media-ffprobe:9480
      SUBTITLES_GRPC_CLIENT_ADDR: media-subtitles:9520
      METADATA_TMDB_GRPC_ADDR: metadata-tmdb:9411
      # Durable BFF JSON state (playback policy, livetv, library paths).
      MEDIA_UI_USERDATA_DIR: /data/media-ui
      # Shared with admin-ui /password-resets queue (umbrella #111).
      MEDIA_UI_PASSWORD_RESET_FILE: /data/media-ui/password-resets.json
    ports:
      - "${MEDIA_UI_PORT:-5173}:5173"
    volumes:
      - media-ui-data:/data/media-ui
    depends_on:
      core:
        condition: service_healthy
      auth-local:
        condition: service_started
      userdata-local:
        condition: service_started
      media-movies:
        condition: service_started
      media-tvshows:
        condition: service_started
      request-media:
        condition: service_started

  # Optional Jellyfin playback bridge — compose profile: jellyfin
  #   docker compose -f docker-compose.registry.yml --profile jellyfin up -d
  # run-host equivalent: MVP_ENABLE_JELLYFIN=1
  # Soft-empty without JELLYFIN_BASE_URL + JELLYFIN_API_KEY; standalone NixOS Jellyfin is separate.
  jellyfin-bridge:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/jellyfin:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: jellyfin
      JELLYFIN_DATA_DIR: /data/jellyfin
      JELLYFIN_BASE_URL: ${JELLYFIN_BASE_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_WEBHOOK_SECRET: ${JELLYFIN_WEBHOOK_SECRET:-}
      USERDATA_SYNC: ${USERDATA_SYNC:-1}
      USERDATA_SYNC_INTERVAL_SECONDS: ${USERDATA_SYNC_INTERVAL_SECONDS:-300}
      USERDATA_LOCAL_URL: ${USERDATA_LOCAL_URL:-http://userdata-local:9672}
      USERDATA_PUSH_TO_JELLYFIN: ${USERDATA_PUSH_TO_JELLYFIN:-0}
    volumes:
      - jellyfin-data:/data
    depends_on:
      core:
        condition: service_healthy
    profiles: ["jellyfin"]

  # Optional Plex playback bridge — compose profile: plex
  #   docker compose -f docker-compose.registry.yml --profile plex up -d
  # run-host equivalent: MVP_ENABLE_PLEX=1
  # Soft-empty without PLEX_URL + PLEX_TOKEN; sync-lists returns 401 without PLEX_HTTP_SECRET.
  plex-bridge:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/plex:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: plex
      PLEX_DATA_DIR: /data/plex
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_HTTP_SECRET: ${PLEX_HTTP_SECRET:-}
    volumes:
      - plex-data:/data
    depends_on:
      core:
        condition: service_healthy
    profiles: ["plex"]

  # Optional Emby playback bridge — compose profile: emby
  #   docker compose -f docker-compose.registry.yml --profile emby up -d
  # run-host equivalent: MVP_ENABLE_EMBY=1
  # Soft-empty without EMBY_URL + EMBY_TOKEN; SSE/catalog paths fail closed without EMBY_SSE_SECRET.
  emby-bridge:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/emby:${MUXCORE_IMAGE_TAG:-v0.6.13}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: emby
      EMBY_DATA_DIR: /data/emby
      EMBY_URL: ${EMBY_URL:-}
      EMBY_TOKEN: ${EMBY_TOKEN:-}
      EMBY_SSE_SECRET: ${EMBY_SSE_SECRET:-}
    volumes:
      - emby-data:/data
    depends_on:
      core:
        condition: service_healthy
    profiles: ["emby"]

networks:
  muxcore:

volumes:
  core-data:
  auth-data:
  auth-oidc-data:
  sqlite-data:
  downloads:
  movies:
  shows:
  userdata-data:
  backup-data:
  backup-restore-data:
  dlna-data:
  tagging-data:
  intro-outro-data:
  playback-guard-data:
  playback-monitor-data:
  transcoder-pool-data:
  media-ui-data:
  jellyfin-data:
  plex-data:
  emby-data:
  secrets-file-data:
  encryption-aesgcm-data:
  admin-ui-data:
  media-movies-data:
  media-tvshows-data:
  media-scanner-data:
  media-automation-data:
  request-media-data:
  media-custom-formats-data:
  media-rename-data:
  media-ffprobe-data:
  media-subtitles-data:
  media-root-folders-data:
