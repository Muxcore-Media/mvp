# MuxCore MVP — pull prebuilt images from an OCI registry (no sibling Go builds).
# Default is a LAN registry (local-registry.sh); no GHCR write:packages required.
# See scripts/publish-muxcored-local.sh and docs/PUBLIC-INSTALL.md (ADR-0007).
#
# Security profile: household (ADR-0016) — TLS on every gRPC hop, core's CA
# created automatically, every module enrolls for its own certificate
# (ADR-0017). Generate the enrollment secret and per-module tokens first:
#   ./scripts/gen-enrollment.sh          # writes MUXCORE_ENROLL_* into .env (0600)
# Insecure dev loop: add -f docker-compose.dev.yml (dev profile, plaintext mesh).
#
# Usage (from this directory):
#   export MUXCORE_REGISTRY=localhost:5000/muxcore          # or ghcr.io/muxcore-media once published
#   export MUXCORE_IMAGE_TAG=v0.6.15
#   export DOWNLOADER_ENGINE=fixture
#   ./scripts/gen-enrollment.sh
#   docker compose -f docker-compose.registry.yml pull
#   docker compose -f docker-compose.registry.yml up -d
#   ./scripts/smoke-registry.sh    # no host Go / sibling clones (or ./smoke.sh auto-detects)
#
# Publish muxcored (build host with sibling GitHub checkouts):
#   MUXCORE_REGISTRY=… ./scripts/publish-muxcored-local.sh v0.6.15
# Module images must be tagged under the same MUXCORE_REGISTRY prefix.
#
# Prefer ./run-host.sh when developing from sibling clones.
# GHCR: the same file with MUXCORE_REGISTRY=ghcr.io/muxcore-media once images are
# published there (needs a write:packages token; not yet available).

name: muxcore-mvp-registry

# Module gRPC listen addresses are "<service>:<port>", never ":<port>": in the
# insecure dev profile (docker-compose.dev.yml) the modules rewrite a host-less
# bind to 127.0.0.1, and the address a module listens on is also the one it
# advertises to core (scripts/check-compose-grpc-binds_test.sh).
#
# Mesh identity (ADR-0017): every module service gets
#   - MUXCORE_BOOTSTRAP_TOKEN from .env (scripts/gen-enrollment.sh; single use),
#   - its own `<service>-id` volume at /data/mesh-id (MUXCORE_TLS_DIR: the key,
#     certificate and CA it enrolled with; reused on every restart),
#   - core's public CA read-only at /data/mesh-ca (MUXCORE_TLS_CA),
#   - MUXCORE_ENROLL_DNS_NAMES=<service>, so peers dialling "<service>:<port>"
#     can verify it (the module ID is always a SAN; other names need core's
#     MUXCORE_ENROLL_SAN_ALLOW).
# Lost an identity volume? `docker compose exec core ./muxcored enroll reset <id>`
# and restart the module (docs/PUBLIC-INSTALL.md).
x-image: &image
  image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/${MUXCORE_SERVICE:-muxcored}:${MUXCORE_IMAGE_TAG:-v0.6.15}
  restart: unless-stopped
  networks: [muxcore]
  environment: &module_env
    MUXCORE_GRPC_ADDR: core:9090
    MUXCORE_PROFILE: ${MUXCORE_PROFILE:-household}
    MUXCORE_TLS_DIR: /data/mesh-id
    MUXCORE_TLS_CA: /data/mesh-ca/ca.crt
    MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}

services:
  core:
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/muxcored:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      MUXCORE_CONFIG: /app/muxcore.json
      MUXCORE_SERVER_ADDR: ":8080"
      # household (ADR-0016): TLS on gRPC and HTTP with an automatic core CA;
      # the insecure flag is fatal. Dev loop: docker-compose.dev.yml.
      MUXCORE_PROFILE: ${MUXCORE_PROFILE:-household}
      MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}
      MUXCORE_STORAGE_DIR: /app/data/storage
      # The CA (key, enrollment ledger, core's server certificate) is install key
      # material on its own volume, not in core-data: it is never in a backup
      # archive (ADR-0013), so a restore keeps every module's identity valid.
      # The core image (>= v0.6.15) pre-creates /app/ca and /app/mesh-ca owned by
      # its user, so the fresh named volumes inherit that ownership.
      MUXCORE_GRPC_CA_CERT_DIR: /app/ca
      # Public ca.crt for the modules (mounted read-only at /data/mesh-ca).
      MUXCORE_CA_EXPORT_DIR: /app/mesh-ca
      # Modules dial "core:9090"; the name must be in core's certificate.
      MUXCORE_TLS_SERVER_SANS: core
      # Enrollment (ADR-0017): tokens are HMAC(secret, module ID), single use.
      MUXCORE_ENROLL_SECRET: ${MUXCORE_ENROLL_SECRET:?run scripts/gen-enrollment.sh (mesh enrollment secret + tokens in .env)}
      # Extra DNS SANs modules may request: service names that differ from the
      # module ID (the ID itself is always allowed).
      MUXCORE_ENROLL_SAN_ALLOW: jellyfin-bridge,plex-bridge,emby-bridge
    ports:
      - "${MUXCORE_HTTP_PORT:-8080}:8080"
      - "${MUXCORE_GRPC_PORT:-9090}:9090"
    volumes:
      - core-data:/app/data
      - core-ca:/app/ca
      - mesh-ca:/app/mesh-ca
      - ./muxcore.json:/app/muxcore.json:ro
    healthcheck:
      # HTTP is TLS too in household (core's certificate has a 127.0.0.1 SAN).
      test: ["CMD-SHELL", "curl -sf --cacert /app/mesh-ca/ca.crt https://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [muxcore]

  api-rest:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/api-rest:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: api-rest
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_API_REST:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: api-rest
      API_REST_HTTP_ADDR: ":8080"
      API_REST_GRPC_ADDR: api-rest:9400
    ports:
      - "${API_REST_HTTP_PORT:-18080}:8080"
      - "${API_REST_GRPC_PORT:-9400}:9400"
    volumes:
      - api-rest-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  auth-local:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/auth-local:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: auth-local
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_AUTH_LOCAL:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: auth-local
      AUTH_DB_PATH: /data/auth.db
      AUTH_GRPC_ADDR: auth-local:9403
      AUTH_HTTP_ADDR: ":9401"
      AUTH_BOOTSTRAP_USER: ${MVP_ADMIN_USER:-admin}
      AUTH_BOOTSTRAP_PASSWORD: ${MVP_ADMIN_PASSWORD:?set MVP_ADMIN_PASSWORD in .env (openssl rand -hex 16)}
    ports:
      - "${AUTH_LOCAL_PORT:-9403}:9403"
      - "${AUTH_HTTP_PORT:-9401}:9401"
    volumes:
      - auth-data:/data
      - auth-local-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  # Optional OIDC SSO auth — compose profile: auth-oidc
  #   docker compose -f docker-compose.registry.yml --profile auth-oidc up -d
  # run-host equivalent: MVP_ENABLE_AUTH_OIDC=1
  # Swap-in for auth-local only — do not run both in the same mesh (duplicate AuthProvider).
  # Soft-empty when AUTH_OIDC_ISSUER / client / redirect unset (Health unhealthy, login 503).
  auth-oidc:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/auth-oidc:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: auth-oidc
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_AUTH_OIDC:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: auth-oidc
      AUTH_OIDC_GRPC_ADDR: auth-oidc:9410
      AUTH_OIDC_HTTP_ADDR: ":9412"
      AUTH_OIDC_DB_PATH: /data/auth-oidc/auth.db
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_REDIRECT_URL: ${AUTH_OIDC_REDIRECT_URL:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid profile email}
      AUTH_OIDC_ROLE_MAP: ${AUTH_OIDC_ROLE_MAP:-}
      AUTH_OIDC_ROLES_CLAIM: ${AUTH_OIDC_ROLES_CLAIM:-groups}
      AUTH_OIDC_DEFAULT_ROLES: ${AUTH_OIDC_DEFAULT_ROLES:-user}
      AUTH_OIDC_SESSION_TTL: ${AUTH_OIDC_SESSION_TTL:-24h}
      AUTH_ALLOWED_REDIRECT_HOSTS: ${AUTH_ALLOWED_REDIRECT_HOSTS:-}
      ADMIN_UI_PUBLIC_URL: ${ADMIN_UI_PUBLIC_URL:-}
      MEDIA_UI_PUBLIC_URL: ${MEDIA_UI_PUBLIC_URL:-}
    ports:
      - "${AUTH_OIDC_GRPC_PORT:-9410}:9410"
      - "${AUTH_OIDC_HTTP_PORT:-9412}:9412"
    volumes:
      - auth-oidc-data:/data
      - auth-oidc-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["auth-oidc"]

  # Optional process-local in-memory cache layer — compose profile: cache-local
  #   docker compose -f docker-compose.registry.yml --profile cache-local up -d
  # run-host equivalent: MVP_ENABLE_CACHE_LOCAL=1
  # In-memory only — no durable volume; entries lost on restart.
  cache-local:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/cache-local:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: cache-local
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_CACHE_LOCAL:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: cache-local
      CACHE_LOCAL_GRPC_ADDR: cache-local:9602
    ports:
      - "${CACHE_LOCAL_GRPC_PORT:-9602}:9602"
    volumes:
      - cache-local-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["cache-local"]

  database-sqlite:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/database-sqlite:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: database-sqlite
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_DATABASE_SQLITE:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: database-sqlite
      SQLITE_DB_PATH: /data/muxcore.db
      # Bind the service name: the dev override's insecure mode rewrites ":port"
      # binds to loopback (see the note above x-image).
      DATABASE_GRPC_ADDR: database-sqlite:9700
    volumes:
      - sqlite-data:/data
      - database-sqlite-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  secrets-file:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/secrets-file:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: secrets-file
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_SECRETS_FILE:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: secrets-file
      SECRETS_STORE: /data/secrets.json
      # Bind the service name: the dev override's insecure mode rewrites ":port"
      # binds to loopback (see the note above x-image).
      SECRETS_GRPC_ADDR: secrets-file:9550
      # Required (64 hex chars, e.g. `openssl rand -hex 32`). Keep it OUTSIDE the
      # backup archive (operator .env / password manager): a restored secrets.json
      # is unreadable without it. Unset = fail closed at Init (ADR-0013).
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-}
    volumes:
      - secrets-file-data:/data
      - secrets-file-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  # Optional Vault/OpenBao/cloud secrets sidecar — append the selection overlay:
  #   docker compose -f docker-compose.registry.yml -f docker-compose.secrets-vault.yml up -d
  # run-host equivalent: MVP_ENABLE_SECRETS_VAULT=1
  # Stop the old provider first. Raw --profile secrets-vault is unsupported:
  # profiles are additive and would also select secrets-file.
  # Fail-closed: module Init() refuses to start without SECRETS_BACKEND + provider env.
  secrets-vault:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/secrets-vault:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: secrets-vault
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_SECRETS_VAULT:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: secrets-vault
      SECRETS_GRPC_ADDR: secrets-vault:9551
      SECRETS_BACKEND: ${SECRETS_BACKEND:-}
      SECRETS_PREFIX: ${SECRETS_PREFIX:-muxcore/}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-dev}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL:-}
    ports:
      - "${SECRETS_VAULT_GRPC_PORT:-9551}:9551"
    volumes:
      - secrets-vault-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["secrets-vault"]

  encryption-aesgcm:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/encryption-aesgcm:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: encryption-aesgcm
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_ENCRYPTION_AESGCM:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: encryption-aesgcm
      # Bind the service name: the dev override's insecure mode rewrites ":port"
      # binds to loopback (see the note above x-image).
      ENCRYPTION_GRPC_ADDR: encryption-aesgcm:9601
      # Keyring is generated on first start. Key material: not in the backup
      # archive (household-manifest excluded_volumes); export it separately.
      ENCRYPTION_KEY_FILE: /data/master.key
    volumes:
      - encryption-aesgcm-data:/data
      - encryption-aesgcm-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  call-policy-default:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/call-policy-default:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: call-policy-default
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_CALL_POLICY_DEFAULT:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: call-policy-default
      CALL_POLICY_GRPC_ADDR: call-policy-default:9101
      # Shipped next to the binary (module images copy policies.yaml into /app).
      CALL_POLICY_FILE: /app/policies.yaml
    volumes:
      - call-policy-default-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  publish-policy-default:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/publish-policy-default:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: publish-policy-default
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_PUBLISH_POLICY_DEFAULT:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: publish-policy-default
      PUBLISH_POLICY_GRPC_ADDR: publish-policy-default:9102
      PUBLISH_POLICY_FILE: /app/policies.yaml
    volumes:
      - publish-policy-default-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  health-monitor:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/health-monitor:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: health-monitor
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_HEALTH_MONITOR:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: health-monitor
      # Bind the service name: the dev override's insecure mode rewrites ":port"
      # binds to loopback (see the note above x-image).
      HEALTH_MONITOR_GRPC_ADDR: health-monitor:9202
      # Off-loopback HTTP needs a bearer token (NFR-SEC-011); admin-ui sends it.
      HEALTH_MONITOR_HTTP_ADDR: "0.0.0.0:9203"
      HEALTH_MONITOR_HTTP_TOKEN: ${HEALTH_MONITOR_HTTP_TOKEN:?set HEALTH_MONITOR_HTTP_TOKEN in .env (openssl rand -hex 32)}
    volumes:
      - health-monitor-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  admin-ui:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/admin-ui:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: admin-ui
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_ADMIN_UI:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: admin-ui
      ADMIN_UI_ADDR: ":8082"
      # admin-ui reads its own core address (not MUXCORE_GRPC_ADDR).
      ADMIN_UI_CORE_ADDR: core:9090
      # Browser-facing login URL (published auth-local HTTP port) vs the
      # in-network URL admin-ui uses server-side.
      ADMIN_UI_AUTH_ADDR: ${ADMIN_UI_AUTH_ADDR:-http://localhost:9401}
      ADMIN_UI_AUTH_INTERNAL_ADDR: http://auth-local:9401
      ADMIN_UI_USERDATA_URL: http://userdata-local:9672
      ADMIN_UI_DATA_DIR: /data
      # Shared with media-ui consumer POST /api/password-reset (umbrella #111).
      ADMIN_UI_PASSWORD_RESET_FILE: /data/media-ui/password-resets.json
      ADMIN_UI_HEALTH_MONITOR_URL: ${ADMIN_UI_HEALTH_MONITOR_URL:-http://health-monitor:9203}
      ADMIN_UI_HEALTH_MONITOR_TOKEN: ${HEALTH_MONITOR_HTTP_TOKEN:?set HEALTH_MONITOR_HTTP_TOKEN in .env (openssl rand -hex 32)}
      # Restore allow-list root; matches the BFF/backup-local BACKUP_RESTORE_DIR.
      ADMIN_UI_RESTORE_ROOT: /data/restore
    ports:
      - "${ADMIN_UI_HTTP_PORT:-8082}:8082"
    volumes:
      - admin-ui-data:/data
      - media-ui-data:/data/media-ui
      - admin-ui-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy
      auth-local:
        condition: service_started

  media-movies:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-movies:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-movies
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_MEDIA_MOVIES:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: media-movies
      MOVIES_DB_PATH: /data/movies.db
      MOVIES_IMAGE_DIR: /data/images
      # Bind the service name so the media-ui BFF can reach gRPC across containers.
      MOVIES_GRPC_ADDR: media-movies:9420
      MOVIES_HTTP_ADDR: ":9430"
    volumes:
      - media-movies-data:/data
      # Library (scanner import target) read-only for /stream.
      - movies:/data/movies:ro
      - media-movies-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  media-tvshows:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-tvshows:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-tvshows
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_MEDIA_TVSHOWS:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: media-tvshows
      TVSHOWS_DB_PATH: /data/tvshows.db
      TVSHOWS_IMAGE_DIR: /data/images
      TVSHOWS_GRPC_ADDR: media-tvshows:9440
      TVSHOWS_HTTP_ADDR: ":9450"
    volumes:
      - media-tvshows-data:/data
      # Library (scanner import target) read-only for /stream/tv.
      - shows:/data/shows:ro
      - media-tvshows-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  media-automation:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/media-automation:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-automation
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_MEDIA_AUTOMATION:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: media-automation
      AUTOMATION_GRPC_ADDR: media-automation:9460
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      AUTOMATION_DB_PATH: /data/automation.db
      AUTOMATION_DOWNLOAD_DIR: /data/downloads
      MVP_DOWNLOADS_DIR: /data/downloads
    volumes:
      - media-automation-data:/data
      - downloads:/data/downloads
      - media-automation-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy

  # Optional acquisition downloaders — compose profiles (off by default; not in Path A stack).
  # run-host equivalents: MVP_ENABLE_DOWNLOADER_*=1 (see .env.example).
  #   docker compose -f docker-compose.registry.yml --profile downloader-torrent up -d
  downloader-native-torrent:
    <<: *image
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/downloader-native-torrent:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-native-torrent
      DOWNLOADER_INDEXER_HOSTS: ${DOWNLOADER_INDEXER_HOSTS:-}
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_DOWNLOADER_NATIVE_TORRENT:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
