      MUXCORE_MODULE_ID: jellyfin
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_JELLYFIN:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: jellyfin-bridge
      JELLYFIN_DATA_DIR: /data/jellyfin
      JELLYFIN_BASE_URL: ${JELLYFIN_BASE_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_WEBHOOK_SECRET: ${JELLYFIN_WEBHOOK_SECRET:-}
      USERDATA_SYNC: ${USERDATA_SYNC:-1}
      USERDATA_SYNC_INTERVAL_SECONDS: ${USERDATA_SYNC_INTERVAL_SECONDS:-300}
      USERDATA_LOCAL_URL: ${USERDATA_LOCAL_URL:-http://userdata-local:9672}
      USERDATA_PUSH_TO_JELLYFIN: ${USERDATA_PUSH_TO_JELLYFIN:-0}
    volumes:
      - jellyfin-data:/data
      - jellyfin-bridge-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["jellyfin"]

  # Optional Plex playback bridge — compose profile: plex
  #   docker compose -f docker-compose.registry.yml --profile plex up -d
  # run-host equivalent: MVP_ENABLE_PLEX=1
  # Soft-empty without PLEX_URL + PLEX_TOKEN; sync-lists returns 401 without PLEX_HTTP_SECRET.
  plex-bridge:
    <<: *image
    networks:
      muxcore:
        # Module ID as a name too (core and peers may dial the ID).
        aliases: [plex]
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/plex:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: plex
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_PLEX:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: plex-bridge
      PLEX_DATA_DIR: /data/plex
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_HTTP_SECRET: ${PLEX_HTTP_SECRET:-}
    volumes:
      - plex-data:/data
      - plex-bridge-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["plex"]

  # Optional Emby playback bridge — compose profile: emby
  #   docker compose -f docker-compose.registry.yml --profile emby up -d
  # run-host equivalent: MVP_ENABLE_EMBY=1
  # Soft-empty without EMBY_URL + EMBY_TOKEN; SSE/catalog paths fail closed without EMBY_SSE_SECRET.
  emby-bridge:
    <<: *image
    networks:
      muxcore:
        # Module ID as a name too (core and peers may dial the ID).
        aliases: [emby]
    image: ${MUXCORE_REGISTRY:-localhost:5000/muxcore}/emby:${MUXCORE_IMAGE_TAG:-v0.6.15}
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: emby
      MUXCORE_BOOTSTRAP_TOKEN: ${MUXCORE_ENROLL_TOKEN_EMBY:?run scripts/gen-enrollment.sh (mesh enrollment tokens in .env)}
      MUXCORE_ENROLL_DNS_NAMES: emby-bridge
      EMBY_DATA_DIR: /data/emby
      EMBY_URL: ${EMBY_URL:-}
      EMBY_TOKEN: ${EMBY_TOKEN:-}
      EMBY_SSE_SECRET: ${EMBY_SSE_SECRET:-}
    volumes:
      - emby-data:/data
      - emby-bridge-id:/data/mesh-id
      - mesh-ca:/data/mesh-ca:ro
    depends_on:
      core:
        condition: service_healthy
    profiles: ["emby"]

