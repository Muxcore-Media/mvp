---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-ui
  labels:
    app.kubernetes.io/name: media-ui
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-ui
    spec:
      containers:
        - name: media-ui
          image: ghcr.io/muxcore-media/media-ui-app:v0.1.12
          env:
            - { name: MUXCORE_INSECURE_DISABLE_TLS, value: "true" }
            - { name: AUTH_HTTP_URL, value: "http://auth-local:9401" }
            - { name: MOVIES_HTTP_URL, value: "http://media-movies:9430" }
            - { name: TVSHOWS_HTTP_URL, value: "http://media-tvshows:9450" }
            - { name: REQUEST_MEDIA_HTTP_URL, value: "http://request-media:9380" }
          ports:
            - { name: http, containerPort: 5173 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: media-ui
spec:
  selector:
    app.kubernetes.io/name: media-ui
  ports:
    - { name: http, port: 5173, targetPort: http }
