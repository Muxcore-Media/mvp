# Media MVP stack overlay — extends minimal platform base with acquire→library→UI peers.
# Apply after platform base is healthy: kubectl apply -k deploy/kustomize/overlays/media-stack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-tmdb
  labels:
    app.kubernetes.io/name: metadata-tmdb
    app.kubernetes.io/part-of: muxcore
    app.kubernetes.io/component: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-tmdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-tmdb
        app.kubernetes.io/part-of: muxcore
    spec:
      containers:
        - name: metadata-tmdb
          image: ghcr.io/muxcore-media/metadata-tmdb:v0.1.5
          env:
            - { name: MUXCORE_GRPC_ADDR, value: muxcored:9090 }
            - { name: MUXCORE_MODULE_ID, value: metadata-tmdb }
            - { name: MUXCORE_INSECURE_DISABLE_TLS, value: "true" }
          ports:
            - { name: grpc, containerPort: 9411 }
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-tmdb
  labels:
    app.kubernetes.io/name: metadata-tmdb
spec:
  selector:
    app.kubernetes.io/name: metadata-tmdb
  ports:
    - { name: grpc, port: 9411, targetPort: grpc }
---
