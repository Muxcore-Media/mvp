            - { name: MUXCORE_MODULE_ID, value: media-movies }
            - { name: MUXCORE_INSECURE_DISABLE_TLS, value: "true" }
          ports:
            - { name: http, containerPort: 9430 }
            - { name: grpc, containerPort: 9420 }
---
