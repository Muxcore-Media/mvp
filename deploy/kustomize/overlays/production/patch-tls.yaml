# Production overlay: require mesh TLS (pair with cert injection / staging CA).
# Images still expect GHCR publish (P0); until then prefer overlays/dev or run-host.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muxcored
spec:
  template:
    spec:
      containers:
        - name: muxcored
          env:
            - name: MUXCORE_INSECURE_DISABLE_TLS
              value: "false"
---
