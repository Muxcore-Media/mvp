apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/part-of: muxcore
    app.kubernetes.io/component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-ui
        app.kubernetes.io/part-of: muxcore
    spec:
      containers:
        - name: admin-ui
          image: git.zem.systems/muxcore/admin-ui:v0.5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: MUXCORE_GRPC_ADDR
              value: muxcored:9090
            - name: MUXCORE_INSECURE_DISABLE_TLS
              value: "true"
            - name: ADMIN_UI_ADDR
              value: ":8082"
            - name: ADMIN_UI_AUTH_ADDR
              value: http://auth-local:9401
            - name: ADMIN_UI_HEALTH_MONITOR_URL
              value: http://health-monitor:9203
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-ui
  labels:
    app.kubernetes.io/name: admin-ui
    app.kubernetes.io/part-of: muxcore
spec:
  selector:
    app.kubernetes.io/name: admin-ui
  ports:
    - name: http
      port: 8082
      targetPort: http
