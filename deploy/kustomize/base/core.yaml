apiVersion: apps/v1
kind: Deployment
metadata:
  name: muxcored
  labels:
    app.kubernetes.io/name: muxcored
    app.kubernetes.io/part-of: muxcore
    app.kubernetes.io/component: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: muxcored
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muxcored
        app.kubernetes.io/part-of: muxcore
        app.kubernetes.io/component: core
    spec:
      containers:
        - name: muxcored
          image: git.zem.systems/muxcore/muxcored:v0.5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: MUXCORE_CONFIG
              value: /app/muxcore.json
            - name: MUXCORE_SERVER_ADDR
              value: ":8080"
            - name: MUXCORE_INSECURE_DISABLE_TLS
              value: "true"
            - name: MUXCORE_LOG_LEVEL
              value: info
            - name: MUXCORE_STORAGE_DIR
              value: /app/data/storage
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /app/muxcore.json
              subPath: muxcore.json
              readOnly: true
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: muxcore-core-config
        - name: data
          persistentVolumeClaim:
            claimName: muxcored-data
---
apiVersion: v1
kind: Service
metadata:
  name: muxcored
  labels:
    app.kubernetes.io/name: muxcored
    app.kubernetes.io/part-of: muxcore
spec:
  selector:
    app.kubernetes.io/name: muxcored
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: muxcored-data
  labels:
    app.kubernetes.io/name: muxcored
    app.kubernetes.io/part-of: muxcore
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
