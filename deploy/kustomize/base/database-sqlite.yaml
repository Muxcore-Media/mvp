apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-sqlite
  labels:
    app.kubernetes.io/name: database-sqlite
    app.kubernetes.io/part-of: muxcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: database-sqlite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-sqlite
        app.kubernetes.io/part-of: muxcore
    spec:
      containers:
        - name: database-sqlite
          image: git.zem.systems/muxcore/database-sqlite:v0.5.7
          imagePullPolicy: IfNotPresent
          env:
            - name: MUXCORE_GRPC_ADDR
              value: muxcored:9090
            - name: MUXCORE_MODULE_ID
              value: database-sqlite
            - name: MUXCORE_INSECURE_DISABLE_TLS
              value: "true"
            - name: SQLITE_DB_PATH
              value: /data/muxcore.db
            - name: DATABASE_GRPC_ADDR
              value: 127.0.0.1:9700
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-sqlite-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-sqlite-data
  labels:
    app.kubernetes.io/name: database-sqlite
    app.kubernetes.io/part-of: muxcore
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
