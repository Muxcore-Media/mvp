apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
  labels:
    app.kubernetes.io/name: health-monitor
    app.kubernetes.io/part-of: muxcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-monitor
        app.kubernetes.io/part-of: muxcore
    spec:
      containers:
        - name: health-monitor
          image: ghcr.io/muxcore-media/health-monitor:v0.1.5
          imagePullPolicy: IfNotPresent
          env:
            - name: MUXCORE_GRPC_ADDR
              value: muxcored:9090
            - name: MUXCORE_MODULE_ID
              value: health-monitor
            - name: MUXCORE_INSECURE_DISABLE_TLS
              value: "true"
            - name: HEALTH_MONITOR_GRPC_ADDR
              value: ":9202"
            - name: HEALTH_MONITOR_HTTP_ADDR
              value: ":9203"
          ports:
            - name: grpc
              containerPort: 9202
            - name: http
              containerPort: 9203
          readinessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: health-monitor
  labels:
    app.kubernetes.io/name: health-monitor
    app.kubernetes.io/part-of: muxcore
spec:
  selector:
    app.kubernetes.io/name: health-monitor
  ports:
    - name: http
      port: 9203
      targetPort: http
    - name: grpc
      port: 9202
      targetPort: grpc
