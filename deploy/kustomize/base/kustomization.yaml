apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Image pins use the LAN registry localhost:5000/muxcore/* and track household-manifest.yaml core_tag (v0.5.7).
# GHCR (ghcr.io/muxcore-media/*) is optional once images are published there — override with `images:`.
namespace: muxcore
resources:
  - namespace.yaml
  - core-config.yaml
  - core.yaml
  - api-rest.yaml
  - auth-local.yaml
  - database-sqlite.yaml
  - secrets-file.yaml
  - encryption-aesgcm.yaml
  - policies.yaml
  - health-monitor.yaml
  - admin-ui.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: muxcore
    includeSelectors: false
