apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Image pins use the LAN registry localhost:5000/muxcore/* and track household-manifest.yaml core_tag (v0.6.15).
# GHCR (ghcr.io/muxcore-media/*) is optional once images are published there — override with `images:`.
namespace: muxcore
resources:
  - namespace.yaml
  - core-config.yaml
  - core.yaml
  - api-rest.yaml
  - auth-local.yaml
  - database-sqlite.yaml
  - secrets-file.yaml
  - encryption-aesgcm.yaml
  - policies.yaml
  - health-monitor.yaml
  - admin-ui.yaml
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: muxcore
    includeSelectors: false
# health-monitor HTTP bearer (NFR-SEC-011). health-monitor refuses a non-loopback bind without it.
# health-monitor.env is operator-created, git-ignored, and has no default: kustomize fails if it is missing.
# Create it with: echo "HEALTH_MONITOR_HTTP_TOKEN=$(openssl rand -hex 32)" > health-monitor.env
secretGenerator:
  - name: health-monitor-token
    envs:
      - health-monitor.env
