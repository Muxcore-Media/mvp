apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-local
  labels:
    app.kubernetes.io/name: auth-local
    app.kubernetes.io/part-of: muxcore
    app.kubernetes.io/component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-local
        app.kubernetes.io/part-of: muxcore
    spec:
      containers:
        - name: auth-local
          image: ghcr.io/muxcore-media/auth-local:v0.1.5
          imagePullPolicy: IfNotPresent
          env:
            - name: MUXCORE_GRPC_ADDR
              value: muxcored:9090
            - name: MUXCORE_MODULE_ID
              value: auth-local
            - name: MUXCORE_INSECURE_DISABLE_TLS
              value: "true"
            - name: AUTH_DB_PATH
              value: /data/auth.db
            - name: AUTH_GRPC_ADDR
              value: ":9403"
            - name: AUTH_HTTP_ADDR
              value: ":9401"
            - name: AUTH_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: muxcore-auth
                  key: admin-password
                  optional: true
          ports:
            - name: grpc
              containerPort: 9403
            - name: http
              containerPort: 9401
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: auth-local-data
---
apiVersion: v1
kind: Service
metadata:
  name: auth-local
  labels:
    app.kubernetes.io/name: auth-local
    app.kubernetes.io/part-of: muxcore
spec:
  selector:
    app.kubernetes.io/name: auth-local
  ports:
    - name: grpc
      port: 9403
      targetPort: grpc
    - name: http
      port: 9401
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-local-data
  labels:
    app.kubernetes.io/name: auth-local
    app.kubernetes.io/part-of: muxcore
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
