apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-policy-default
  labels:
    app.kubernetes.io/name: call-policy-default
    app.kubernetes.io/part-of: muxcore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: call-policy-default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: call-policy-default
        app.kubernetes.io/part-of: muxcore
    spec:
      containers:
        - name: call-policy-default
          image: ghcr.io/muxcore-media/call-policy-default:v0.3.3
          imagePullPolicy: IfNotPresent
          env:
            - name: MUXCORE_GRPC_ADDR
              value: muxcored:9090
            - name: MUXCORE_MODULE_ID
              value: call-policy-default
            - name: MUXCORE_INSECURE_DISABLE_TLS
              value: "true"
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
