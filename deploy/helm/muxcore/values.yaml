# Default values for the MuxCore minimal platform chart.
# Origin/household install uses Forgejo or LAN OCI (`docker-compose.registry.yml`).
# Override `registry` + `coreTag`, or set full image strings under `images.*`.

namespace: muxcore
createNamespace: true

insecureDisableTLS: true

registry: git.zem.systems/muxcore
coreTag: v0.5.8

images:
  pullPolicy: IfNotPresent
  muxcored: git.zem.systems/muxcore/muxcored:v0.5.8
  apiRest: git.zem.systems/muxcore/api-rest:v0.5.8
  authLocal: git.zem.systems/muxcore/auth-local:v0.5.8
  databaseSqlite: git.zem.systems/muxcore/database-sqlite:v0.5.8
  secretsFile: git.zem.systems/muxcore/secrets-file:v0.5.8
  encryptionAesgcm: git.zem.systems/muxcore/encryption-aesgcm:v0.5.8
  callPolicy: git.zem.systems/muxcore/call-policy-default:v0.5.8
  publishPolicy: git.zem.systems/muxcore/publish-policy-default:v0.5.8
  healthMonitor: git.zem.systems/muxcore/health-monitor:v0.5.8
  adminUi: git.zem.systems/muxcore/admin-ui:v0.5.8

persistence:
  coreSize: 5Gi
  authSize: 1Gi
  sqliteSize: 5Gi
  secretsSize: 1Gi

auth:
  existingSecret: muxcore-auth
  passwordKey: admin-password

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

media:
  enabled: false
  images:
    metadataTmdb: git.zem.systems/muxcore/metadata-tmdb:v0.5.8
    mediaMovies: git.zem.systems/muxcore/media-movies:v0.5.8
    mediaTvshows: git.zem.systems/muxcore/media-tvshows:v0.5.8
    requestMedia: git.zem.systems/muxcore/request-media:v0.5.8
    mediaAutomation: git.zem.systems/muxcore/media-automation:v0.5.8
    mediaScanner: git.zem.systems/muxcore/media-scanner:v0.5.8
    mediaFfprobe: git.zem.systems/muxcore/media-ffprobe:v0.5.8
    notificationDefault: git.zem.systems/muxcore/notification-default:v0.5.8
    userdataLocal: git.zem.systems/muxcore/userdata-local:v0.5.8
    mediaUi: git.zem.systems/muxcore/media-ui:v0.5.8
  persistence:
    userdataSize: 2Gi

acquisition:
  enabled: false
  images:
    indexerTorznab: git.zem.systems/muxcore/indexer-torznab:v0.5.8
    downloaderNativeTorrent: git.zem.systems/muxcore/downloader-native-torrent:v0.5.8
    downloaderSabnzbd: git.zem.systems/muxcore/downloader-sabnzbd:v0.5.8
    downloaderDebrid: git.zem.systems/muxcore/downloader-debrid:v0.5.8
