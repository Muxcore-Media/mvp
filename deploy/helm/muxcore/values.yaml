# Default values for the MuxCore minimal platform chart.
# Images come from the LAN OCI registry (`local-registry.sh`, `docker-compose.registry.yml`);
# set `registry: ghcr.io/muxcore-media` once images are published to GHCR (ADR-0007).
# Override `registry` + `coreTag`, or set full image strings under `images.*`.

namespace: muxcore
createNamespace: true

insecureDisableTLS: true

registry: localhost:5000/muxcore
coreTag: v0.5.7

images:
  pullPolicy: IfNotPresent
  muxcored: localhost:5000/muxcore/muxcored:v0.5.7
  apiRest: localhost:5000/muxcore/api-rest:v0.5.7
  authLocal: localhost:5000/muxcore/auth-local:v0.5.7
  databaseSqlite: localhost:5000/muxcore/database-sqlite:v0.5.7
  secretsFile: localhost:5000/muxcore/secrets-file:v0.5.7
  encryptionAesgcm: localhost:5000/muxcore/encryption-aesgcm:v0.5.7
  callPolicy: localhost:5000/muxcore/call-policy-default:v0.5.7
  publishPolicy: localhost:5000/muxcore/publish-policy-default:v0.5.7
  healthMonitor: localhost:5000/muxcore/health-monitor:v0.5.7
  adminUi: localhost:5000/muxcore/admin-ui:v0.5.7

persistence:
  coreSize: 5Gi
  authSize: 1Gi
  sqliteSize: 5Gi
  secretsSize: 1Gi

auth:
  existingSecret: muxcore-auth
  passwordKey: admin-password

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

media:
  enabled: false
  images:
    metadataTmdb: localhost:5000/muxcore/metadata-tmdb:v0.5.7
    mediaMovies: localhost:5000/muxcore/media-movies:v0.5.7
    mediaTvshows: localhost:5000/muxcore/media-tvshows:v0.5.7
    requestMedia: localhost:5000/muxcore/request-media:v0.5.7
    mediaAutomation: localhost:5000/muxcore/media-automation:v0.5.7
    mediaScanner: localhost:5000/muxcore/media-scanner:v0.5.7
    mediaFfprobe: localhost:5000/muxcore/media-ffprobe:v0.5.7
    notificationDefault: localhost:5000/muxcore/notification-default:v0.5.7
    userdataLocal: localhost:5000/muxcore/userdata-local:v0.5.7
    mediaUi: localhost:5000/muxcore/media-ui:v0.5.7
  persistence:
    userdataSize: 2Gi

acquisition:
  enabled: false
  images:
    indexerTorznab: localhost:5000/muxcore/indexer-torznab:v0.5.7
    downloaderNativeTorrent: localhost:5000/muxcore/downloader-native-torrent:v0.5.7
    downloaderSabnzbd: localhost:5000/muxcore/downloader-sabnzbd:v0.5.7
    downloaderDebrid: localhost:5000/muxcore/downloader-debrid:v0.5.7
