{{- /* NFR-SEC-011: health-monitor binds 0.0.0.0:9203 and refuses to start without a bearer token. */ -}}
{{- if not .Values.healthMonitor.existingSecret }}
{{- $token := required "healthMonitor.token or healthMonitor.existingSecret is required (health-monitor refuses a non-loopback HTTP bind without a token); e.g. --set healthMonitor.token=$(openssl rand -hex 32)" .Values.healthMonitor.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muxcore.healthMonitorSecretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: health-monitor
    {{- include "muxcore.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "muxcore.healthMonitorSecretKey" . }}: {{ $token | quote }}
{{- end }}
