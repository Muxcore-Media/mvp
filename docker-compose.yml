# MuxCore MVP reference stack (local sibling clones).
# Docs: ../core.wiki/Getting-Started.md, ../core.wiki/Deployment.md
# Spool tags mirrored: minimal + media.
#
# From this directory:
#   docker compose up --build -d
#   ./smoke.sh

name: muxcore-mvp

x-module: &module
  build:
    context: ..
    dockerfile: mvp/dockerfiles/module.Dockerfile
    args:
      GO_VERSION: "1.26"
  environment: &module_env
    MUXCORE_GRPC_ADDR: core:9090
    MUXCORE_INSECURE_DISABLE_TLS: "true"
    MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}
  depends_on:
    core:
      condition: service_healthy
  restart: unless-stopped
  networks: [muxcore]

services:
  core:
    build:
      context: ../core
      dockerfile: Dockerfile
    environment:
      MUXCORE_CONFIG: /app/muxcore.json
      MUXCORE_SERVER_ADDR: ":8080"
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: ${MUXCORE_LOG_LEVEL:-info}
      MUXCORE_STORAGE_DIR: /app/data/storage
    ports:
      - "${MUXCORE_HTTP_PORT:-8080}:8080"
      - "${MUXCORE_GRPC_PORT:-9090}:9090"
    volumes:
      - core-data:/app/data
      - ./muxcore.json:/app/muxcore.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [muxcore]

  # --- platform (spool tag: minimal + policies) ---
  api-rest:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: api-rest }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: api-rest
      API_REST_HTTP_ADDR: ":8080"
      API_REST_GRPC_ADDR: ":9400"
    ports:
      - "${API_REST_HTTP_PORT:-18080}:8080"
      - "${API_REST_GRPC_PORT:-9400}:9400"

  auth-local:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: auth-local }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: auth-local
      AUTH_DB_PATH: /data/auth.db
      AUTH_GRPC_ADDR: ":9403"
      AUTH_HTTP_ADDR: ":9401"
    ports:
      - "${AUTH_LOCAL_PORT:-9403}:9403"
      - "${AUTH_HTTP_PORT:-9401}:9401"
    volumes:
      - auth-data:/data

  database-sqlite:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: database-sqlite }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: database-sqlite
    volumes:
      - sqlite-data:/data

  secrets-file:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: secrets-file }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: secrets-file
    volumes:
      - secrets-data:/data

  encryption-aesgcm:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: encryption-aesgcm }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: encryption-aesgcm

  call-policy-default:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: call-policy-default }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: call-policy-default

  publish-policy-default:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: publish-policy-default }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: publish-policy-default

  health-monitor:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: health-monitor }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: health-monitor
      HEALTH_MONITOR_GRPC_ADDR: ":9202"
      HEALTH_MONITOR_HTTP_ADDR: ":9203"
      HEALTH_MONITOR_INTERVAL: "5s"
    ports:
      - "${HEALTH_MONITOR_HTTP_PORT:-9203}:9203"
      - "${HEALTH_MONITOR_GRPC_PORT:-9202}:9202"

  # Optional observability — compose profile: observability
  #   docker compose --profile observability up -d
  metrics-prometheus:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: metrics-prometheus }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: metrics-prometheus
      METRICS_GRPC_ADDR: ":9900"
      METRICS_HTTP_ADDR: ":9901"
      METRICS_PATH: /metrics
    ports:
      - "${METRICS_HTTP_PORT:-9901}:9901"
      - "${METRICS_GRPC_PORT:-9900}:9900"
    profiles: ["observability"]

  tracing-otlp:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: tracing-otlp }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: tracing-otlp
      TRACING_GRPC_ADDR: ":9613"
      # Leave OTEL_EXPORTER_OTLP_ENDPOINT unset for slog fallback unless a collector is running.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
    ports:
      - "${TRACING_GRPC_PORT:-9613}:9613"
    profiles: ["observability"]


  admin-ui:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: admin-ui }
    environment:
      <<: *module_env
      ADMIN_UI_ADDR: ":8082"
      ADMIN_UI_CORE_ADDR: core:9090
      ADMIN_UI_INSECURE: "true"
      ADMIN_UI_AUTH_ADDR: http://auth-local:9401
      ADMIN_UI_HEALTH_MONITOR_URL: ${ADMIN_UI_HEALTH_MONITOR_URL:-http://health-monitor:9203}
      # Shared with media-ui consumer POST /api/password-reset (umbrella #111).
      ADMIN_UI_PASSWORD_RESET_FILE: /data/media-ui/password-resets.json
      # Leave unset in compose so bare :port discovery addrs resolve via service DNS.
    ports:
      - "${ADMIN_UI_HTTP_PORT:-8082}:8082"
    volumes:
      - media-ui-data:/data/media-ui

  # --- media (spool tag: media) ---
  metadata-tmdb:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: metadata-tmdb }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: metadata-tmdb
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_FIXTURE: ${TMDB_FIXTURE:-}

  metadata-musicbrainz:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: metadata-musicbrainz }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: metadata-musicbrainz
      MUSICBRAINZ_FIXTURE: ${MUSICBRAINZ_FIXTURE:-1}
      METADATA_GRPC_ADDR: ":9413"

  media-movies:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-movies }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-movies
      MOVIES_DB_PATH: /data/movies.db
      MOVIES_IMAGE_DIR: /data/images
    ports:
      - "${MEDIA_MOVIES_HTTP_PORT:-9430}:9430"
    volumes:
      - movies-data:/data

  media-tvshows:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-tvshows }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-tvshows
      TVSHOWS_DB_PATH: /data/tvshows.db
      TVSHOWS_IMAGE_DIR: /data/images
    ports:
      - "${MEDIA_TVSHOWS_HTTP_PORT:-9450}:9450"
    volumes:
      - tvshows-data:/data

  media-music:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-music }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-music
      MUSIC_DATA_DIR: /data/music
      MUSIC_LIBRARY_DIR: /library/music
      MUSIC_GRPC_ADDR: ":9640"
      MUXCORE_HTTP_ADDR: ":9641"
    ports:
      - "${MEDIA_MUSIC_HTTP_PORT:-9641}:9641"
    volumes:
      - music-data:/data
      - library-data:/library

  # Optional library-plus modules — compose profiles: books, comics, audiobooks
  #   docker compose --profile books --profile comics --profile audiobooks up -d
  media-books:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-books }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-books
      BOOKS_DATA_DIR: /data/books
      BOOKS_LIBRARY_DIR: /library/books
      BOOKS_GRPC_ADDR: ":9650"
      MUXCORE_HTTP_ADDR: ":9651"
    ports:
      - "${MEDIA_BOOKS_HTTP_PORT:-9651}:9651"
    volumes:
      - books-data:/data
      - library-data:/library
    profiles: ["books"]

  media-comics:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-comics }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-comics
      COMICS_DATA_DIR: /data/comics
      COMICS_LIBRARY_DIR: /library/comics
      COMICS_GRPC_ADDR: ":9660"
      MUXCORE_HTTP_ADDR: ":9661"
    ports:
      - "${MEDIA_COMICS_HTTP_PORT:-9661}:9661"
    volumes:
      - comics-data:/data
      - library-data:/library
    profiles: ["comics"]

  media-audiobooks:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-audiobooks }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-audiobooks
      AUDIOBOOKS_DATA_DIR: /data/audiobooks
      AUDIOBOOKS_LIBRARY_DIR: /library/audiobooks
      AUDIOBOOKS_GRPC_ADDR: ":9670"
      MUXCORE_HTTP_ADDR: ":9671"
    ports:
      - "${MEDIA_AUDIOBOOKS_HTTP_PORT:-9671}:9671"
    volumes:
      - audiobooks-data:/data
      - library-data:/library
    profiles: ["audiobooks"]

  # Optional import-list sync (Trakt/IMDb/Plex/Jellyfin/Radarr/Sonarr) — compose profile: list-sync
  #   docker compose --profile list-sync up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_LIST_SYNC=1
  media-list-sync:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-list-sync }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-list-sync
      LISTSYNC_GRPC_ADDR: ":9530"
      LISTSYNC_DB_PATH: /data/listsync/listsync.db
    ports:
      - "${LISTSYNC_GRPC_PORT:-9530}:9530"
    volumes:
      - listsync-data:/data
    profiles: ["list-sync"]

  # Optional library maintenance (Maintainerr-class cleanup) — compose profile: library-maintainer
  #   docker compose --profile library-maintainer up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_LIBRARY_MAINTAINER=1
  # userdata-local persists SQLite only (USERDATA_LOCAL_DB_PATH on userdata-data); no JSON watch export dir.
  # MAINTAINER_USERDATA_DIR shares the volume root read-only; maintainer soft-empty if no legacy JSON files.
  media-library-maintainer:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-library-maintainer }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-library-maintainer
      MAINTAINER_GRPC_ADDR: ":9545"
      MAINTAINER_DB_PATH: /data/maintainer/maintainer.db
      MAINTAINER_USERDATA_DIR: /data/userdata
    ports:
      - "${MAINTAINER_GRPC_PORT:-9545}:9545"
    volumes:
      - maintainer-data:/data/maintainer
      - userdata-data:/data/userdata:ro
    profiles: ["library-maintainer"]

  # Optional playback policy enforcement — compose profile: playback-guard
  #   docker compose --profile playback-guard up -d
  # run-host equivalent: MVP_ENABLE_PLAYBACK_GUARD=1
  # Soft-empty without jellyfin/emby/plex playback events; registers on mesh with local SQLite rules DB.
  playback-guard:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: playback-guard }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: playback-guard
      PLAYBACK_GUARD_GRPC_ADDR: ":9561"
      PLAYBACK_GUARD_DB_PATH: /data/playback-guard/guard.db
    ports:
      - "${PLAYBACK_GUARD_GRPC_PORT:-9561}:9561"
    volumes:
      - playback-guard-data:/data/playback-guard
    profiles: ["playback-guard"]

  # Optional playback session monitor — compose profile: playback-monitor
  #   docker compose --profile playback-monitor up -d
  # run-host equivalent: MVP_ENABLE_PLAYBACK_MONITOR=1
  # Subscribes to mesh playback.* events; soft-empty until a playback bridge (jellyfin/emby/plex) emits them.
  playback-monitor:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: playback-monitor }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: playback-monitor
      PLAYBACK_MONITOR_GRPC_ADDR: ":9560"
      PLAYBACK_MONITOR_HTTP_ADDR: ":8560"
      PLAYBACK_MONITOR_DB_PATH: /data/playback-monitor/monitor.db
    ports:
      - "${PLAYBACK_MONITOR_GRPC_PORT:-9560}:9560"
      - "${PLAYBACK_MONITOR_HTTP_PORT:-8560}:8560"
    volumes:
      - playback-monitor-data:/data/playback-monitor
    profiles: ["playback-monitor"]

  media-automation:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-automation }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-automation
      AUTOMATION_DB_PATH: /data/automation.db
      AUTOMATION_GRPC_ADDR: ":9460"
      AUTOMATION_EVENT_SUBSCRIBE_DELAY: 1s
    ports:
      - "${AUTOMATION_GRPC_PORT:-9460}:9460"
    volumes:
      - automation-data:/data

  # Optional acquisition downloaders — compose profiles (off by default; not in Path A stack).
  # run-host equivalents: MVP_ENABLE_DOWNLOADER_*=1 (see .env.example).
  #   docker compose --profile downloader-torrent up -d
  #   docker compose --profile downloader-torrent --profile downloader-qbittorrent up -d
  # Fixture engines by default; live requires WG_CONF / operator credentials.
  downloader-native-torrent:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: downloader-native-torrent }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-native-torrent
      DOWNLOADER_GRPC_ADDR: ":9461"
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      DOWNLOAD_DIR: /downloads
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
      DOWNLOADER_REQUIRE_VPN: ${DOWNLOADER_REQUIRE_VPN:-}
      NAT_PMP_PORT: ${NAT_PMP_PORT:-0}
    ports:
      - "${DOWNLOADER_TORRENT_GRPC_PORT:-9461}:9461"
    volumes:
      - downloads-data:/downloads
    profiles: ["downloader-torrent"]

  downloader-qbittorrent:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: downloader-qbittorrent }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-qbittorrent
      QBIT_GRPC_ADDR: ":9462"
      QBIT_HTTP_ADDR: ":9463"
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      QBIT_FIXTURE: ${QBIT_FIXTURE:-1}
      QBIT_URL: ${QBIT_URL:-}
      QBIT_USERNAME: ${QBIT_USERNAME:-}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
    ports:
      - "${DOWNLOADER_QBIT_GRPC_PORT:-9462}:9462"
      - "${DOWNLOADER_QBIT_HTTP_PORT:-9463}:9463"
    profiles: ["downloader-qbittorrent"]

  downloader-native-usenet:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: downloader-native-usenet }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-native-usenet
      USENET_GRPC_ADDR: ":9622"
      MUXCORE_HTTP_ADDR: ":9623"
      USENET_ENGINE: ${USENET_ENGINE:-fixture}
      USENET_DOWNLOAD_DIR: /downloads/usenet
      USENET_PAR2: ${USENET_PAR2:-auto}
      USENET_UNPACK: ${USENET_UNPACK:-auto}
      NNTP_HOST: ${NNTP_HOST:-}
      NNTP_PORT: ${NNTP_PORT:-}
      NNTP_USER: ${NNTP_USER:-}
      NNTP_PASS: ${NNTP_PASS:-}
      NNTP_SSL: ${NNTP_SSL:-}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
      DOWNLOADER_REQUIRE_VPN: ${DOWNLOADER_REQUIRE_VPN:-}
    ports:
      - "${DOWNLOADER_USENET_GRPC_PORT:-9622}:9622"
      - "${DOWNLOADER_USENET_HTTP_PORT:-9623}:9623"
    volumes:
      - downloads-data:/downloads
    profiles: ["downloader-usenet"]

  downloader-sabnzbd:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: downloader-sabnzbd }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-sabnzbd
      MUXCORE_GRPC_ADDR_OVERRIDE: ":9620"
      MUXCORE_HTTP_ADDR: ":9621"
      SABNZBD_URL: ${SABNZBD_URL:-}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
      DOWNLOADER_ENGINE: ${DOWNLOADER_ENGINE:-fixture}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
      DOWNLOADER_REQUIRE_VPN: ${DOWNLOADER_REQUIRE_VPN:-}
    ports:
      - "${DOWNLOADER_SABNZBD_GRPC_PORT:-9620}:9620"
      - "${DOWNLOADER_SABNZBD_HTTP_PORT:-9621}:9621"
    profiles: ["downloader-sabnzbd"]

  # HTTP defaults to loopback 127.0.0.1:9631 (soft-empty; no DEBRID_HTTP_TOKEN).
  # Open host HTTP: set MUXCORE_HTTP_ADDR=0.0.0.0:9631, DEBRID_HTTP_TOKEN, and publish :9631.
  downloader-debrid:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: downloader-debrid }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: downloader-debrid
      DEBRID_PROVIDER: ${DEBRID_PROVIDER:-}
      DEBRID_TOKEN: ${DEBRID_TOKEN:-}
      REAL_DEBRID_TOKEN: ${REAL_DEBRID_TOKEN:-}
      DEBRID_API_BASE: ${DEBRID_API_BASE:-}
      DEBRID_HTTP_TOKEN: ${DEBRID_HTTP_TOKEN:-}
    ports:
      - "${DOWNLOADER_DEBRID_GRPC_PORT:-9630}:9630"
    profiles: ["downloader-debrid"]

  # Optional acquisition indexers — compose profiles (off by default; not in Path A stack).
  # run-host equivalents: MVP_ENABLE_INDEXER_*=1 (see .env.example).
  #   docker compose --profile indexer-piratebay up -d
  #   docker compose --profile indexer-piratebay --profile indexer-torznab up -d
  # Fixture by default; live requires WG_CONF / operator credentials.
  indexer-piratebay:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: indexer-piratebay }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: indexer-piratebay
      PIRATEBAY_GRPC_ADDR: ":9485"
      PIRATEBAY_HTTP_ADDR: ":9487"
      INDEXER_FIXTURE: ${INDEXER_FIXTURE:-1}
      PIRATEBAY_API_BASE: ${PIRATEBAY_API_BASE:-}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
      DOWNLOADER_REQUIRE_VPN: ${DOWNLOADER_REQUIRE_VPN:-}
    ports:
      - "${INDEXER_PIRATEBAY_GRPC_PORT:-9485}:9485"
      - "${INDEXER_PIRATEBAY_HTTP_PORT:-9487}:9487"
    profiles: ["indexer-piratebay"]

  indexer-torznab:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: indexer-torznab }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: indexer-torznab
      TORZNAB_GRPC_ADDR: ":9486"
      TORZNAB_URL: ${TORZNAB_URL:-}
      TORZNAB_API_KEY: ${TORZNAB_API_KEY:-}
      PROWLARR_URL: ${PROWLARR_URL:-}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      WG_CONF: ${WG_CONF:-}
      WG_USE_WG_QUICK: ${WG_USE_WG_QUICK:-0}
      WG_KILL_SWITCH: ${WG_KILL_SWITCH:-false}
      DOWNLOADER_REQUIRE_VPN: ${DOWNLOADER_REQUIRE_VPN:-}
    ports:
      - "${INDEXER_TORZNAB_GRPC_PORT:-9486}:9486"
    profiles: ["indexer-torznab"]

  media-scanner:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-scanner }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-scanner
      SCANNER_DB_PATH: /data/scanner.db
      SCANNER_LIBRARY_ROOT: /library
      SCANNER_TV_LIBRARY_ROOT: /library/tv
      SCANNER_MUSIC_LIBRARY_ROOT: /library/music
      SCANNER_DEFAULT_WATCH_DIR: /downloads
      SCANNER_IMPORT_MODE: copy
      SCANNER_MIN_VIDEO_BYTES: "0"
      SCANNER_GRPC_ADDR: ":9470"
    ports:
      - "${SCANNER_GRPC_PORT:-9470}:9470"
    volumes:
      - scanner-data:/data
      - library-data:/library
      - downloads-data:/downloads

  media-root-folders:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-root-folders }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-root-folders
      ROOTS_DB_PATH: /data/roots.db
    volumes:
      - roots-data:/data
      - library-data:/library

  request-media:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: request-media }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: request-media
      REQUEST_GRPC_ADDR: ":9481"
      REQUEST_HTTP_ADDR: ":9380"
      REQUEST_DATA_DIR: /data/request
    ports:
      - "${REQUEST_MEDIA_HTTP_PORT:-9380}:9380"
      - "${REQUEST_MEDIA_GRPC_PORT:-9481}:9481"
    volumes:
      - request-data:/data

  notification-default:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: notification-default }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: notification-default
      WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-http://127.0.0.1:9/muxcore-notify-sink}

  # Optional Apprise notification peer — compose profile: apprise
  #   docker compose --profile apprise up -d
  # run-host equivalent: MVP_ENABLE_NOTIFICATION_APPRISE=1
  notification-apprise:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: notification-apprise }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: notification-apprise
      NOTIFY_GRPC_ADDR: ":9445"
      APPRISE_URL: ${APPRISE_URL:-}
      APPRISE_URLS: ${APPRISE_URLS:-}
      APPRISE_TOKEN: ${APPRISE_TOKEN:-}
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK:-}
      SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}
      WEBHOOK_URL: ${APPRISE_WEBHOOK_URL:-${NOTIFY_WEBHOOK_URL:-http://127.0.0.1:9/muxcore-apprise-sink}}
    ports:
      - "${NOTIFICATION_APPRISE_GRPC_PORT:-9445}:9445"
    profiles: ["apprise"]

  # Household userdata mesh — tip module reads USERDATA_LOCAL_DB_PATH (+ HTTP/gRPC addrs) only.
  userdata-local:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: userdata-local }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: userdata-local
      USERDATA_LOCAL_HTTP_ADDR: ":9672"
      USERDATA_LOCAL_GRPC_ADDR: ":9673"
      USERDATA_LOCAL_DB_PATH: /data/userdata.db
    ports:
      - "${USERDATA_LOCAL_PORT:-9672}:9672"
    volumes:
      - userdata-data:/data

  media-custom-formats:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-custom-formats }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-custom-formats

  media-rename:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-rename }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-rename

  media-ffprobe:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-ffprobe }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-ffprobe

  media-subtitles:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-subtitles }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-subtitles

  # Optional Jellyfin playback bridge — compose profile: jellyfin
  #   docker compose --profile jellyfin up -d
  # run-host equivalent: MVP_ENABLE_JELLYFIN=1
  # Soft-empty without JELLYFIN_BASE_URL + JELLYFIN_API_KEY; standalone NixOS Jellyfin is separate.
  jellyfin:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: jellyfin }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: jellyfin
      JELLYFIN_GRPC_ADDR: ":9475"
      JELLYFIN_HTTP_ADDR: ":8475"
      JELLYFIN_DATA_DIR: /data/jellyfin
      JELLYFIN_BASE_URL: ${JELLYFIN_BASE_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      JELLYFIN_WEBHOOK_SECRET: ${JELLYFIN_WEBHOOK_SECRET:-}
      USERDATA_SYNC: ${USERDATA_SYNC:-1}
      USERDATA_SYNC_INTERVAL_SECONDS: ${USERDATA_SYNC_INTERVAL_SECONDS:-300}
      USERDATA_LOCAL_URL: ${USERDATA_LOCAL_URL:-}
      USERDATA_PUSH_TO_JELLYFIN: ${USERDATA_PUSH_TO_JELLYFIN:-0}
    ports:
      - "${JELLYFIN_HTTP_PORT:-8475}:8475"
      - "${JELLYFIN_GRPC_PORT:-9475}:9475"
    volumes:
      - jellyfin-data:/data
    profiles: ["jellyfin"]

  # Optional Plex playback bridge — compose profile: plex
  #   docker compose --profile plex up -d
  # run-host equivalent: MVP_ENABLE_PLEX=1
  # Soft-empty without PLEX_URL + PLEX_TOKEN; sync-lists returns 401 without PLEX_HTTP_SECRET.
  plex:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: plex }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: plex
      PLEX_GRPC_ADDR: ":9476"
      PLEX_HTTP_ADDR: ":8476"
      PLEX_DATA_DIR: /data/plex
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      PLEX_HTTP_SECRET: ${PLEX_HTTP_SECRET:-}
    ports:
      - "${PLEX_HTTP_PORT:-8476}:8476"
      - "${PLEX_GRPC_PORT:-9476}:9476"
    volumes:
      - plex-data:/data
    profiles: ["plex"]

  # Optional Emby playback bridge — compose profile: emby
  #   docker compose --profile emby up -d
  # run-host equivalent: MVP_ENABLE_EMBY=1
  # Soft-empty without EMBY_URL + EMBY_TOKEN; SSE/catalog paths fail closed without EMBY_SSE_SECRET.
  emby:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: emby }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: emby
      EMBY_GRPC_ADDR: ":9477"
      EMBY_HTTP_ADDR: ":8477"
      EMBY_DATA_DIR: /data/emby
      EMBY_URL: ${EMBY_URL:-}
      EMBY_TOKEN: ${EMBY_TOKEN:-}
      EMBY_SSE_SECRET: ${EMBY_SSE_SECRET:-}
    ports:
      - "${EMBY_HTTP_PORT:-8477}:8477"
      - "${EMBY_GRPC_PORT:-9477}:9477"
    volumes:
      - emby-data:/data
    profiles: ["emby"]

  # Optional household backup — profile: backup-local
  #   docker compose --profile backup-local up -d
  # /source/userdata is userdata-data volume root (userdata.db); not a separate JSON export tree.
  backup-local:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: backup-local }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: backup-local
      BACKUP_DIR: /data/backups
      BACKUP_SOURCE_DIRS: ${BACKUP_SOURCE_DIRS:-/source/auth,/source/sqlite,/source/userdata}
      BACKUP_SCHEDULE_CRON: ${BACKUP_SCHEDULE_CRON:-}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-0}
    volumes:
      - backup-data:/data/backups
      - auth-data:/source/auth:ro
      - sqlite-data:/source/sqlite:ro
      - userdata-data:/source/userdata:ro
    profiles: ["backup-local"]

  # Optional FFmpeg transcoder — profile: transcoder
  media-transcoder:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-transcoder }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-transcoder
      TRANSCODER_DB_PATH: /data/transcoder.db
      TRANSCODER_GRPC_ADDR: ":9525"
      TRANSCODER_HTTP_ADDR: ":9526"
      TRANSCODER_MAX_CONCURRENT: ${TRANSCODER_MAX_CONCURRENT:-2}
      TRANSCODER_MAX_PLAYBACK: ${TRANSCODER_MAX_PLAYBACK:-4}
    ports:
      - "${TRANSCODER_GRPC_PORT:-9525}:9525"
      - "${TRANSCODER_HTTP_PORT:-9526}:9526"
    volumes:
      - transcoder-data:/data
    profiles: ["transcoder"]

  # Optional transcoder worker pool — compose profile: transcoder-pool
  #   docker compose --profile transcoder-pool up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_TRANSCODER_POOL=1
  # Soft-empty: coordinator runs without workers; dispatch no-ops until workers register.
  media-transcoder-pool:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-transcoder-pool }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-transcoder-pool
      POOL_DB_PATH: /data/transcoder-pool/pool.db
      MUXCORE_HTTP_ADDR: ":9721"
      POOL_STALE_AFTER_SEC: ${POOL_STALE_AFTER_SEC:-60}
      POOL_DISPATCH: ${POOL_DISPATCH:-}
      POOL_DISPATCH_TIMEOUT_SEC: ${POOL_DISPATCH_TIMEOUT_SEC:-}
    ports:
      - "${TRANSCODER_POOL_GRPC_PORT:-9720}:9720"
      - "${TRANSCODER_POOL_HTTP_PORT:-9721}:9721"
    volumes:
      - transcoder-pool-data:/data/transcoder-pool
    profiles: ["transcoder-pool"]

  # Optional unified media graph — profile: graph
  #   docker compose --profile graph up -d
  # run-host: MVP_ENABLE_MEDIA_GRAPH=1
  media-graph:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-graph }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-graph
      GRAPH_GRPC_ADDR: ":9730"
      MUXCORE_HTTP_ADDR: ":9731"
      GRAPH_DB_PATH: /data/graph/graph.db
      GRAPH_AUTO_LINK: ${GRAPH_AUTO_LINK:-true}
      GRAPH_INGEST_ENABLED: ${GRAPH_INGEST_ENABLED:-true}
      GRAPH_INGEST_INTERVAL: ${GRAPH_INGEST_INTERVAL:-15m}
    ports:
      - "${MEDIA_GRAPH_GRPC_PORT:-9730}:9730"
      - "${MEDIA_GRAPH_HTTP_PORT:-9731}:9731"
    volumes:
      - graph-data:/data/graph
    profiles: ["graph"]

  # Optional DLNA/UPnP media server — compose profile: dlna
  #   docker compose --profile dlna up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_DLNA=1
  media-dlna:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-dlna }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-dlna
      DLNA_GRPC_ADDR: ":9751"
      DLNA_HEALTH_HTTP_ADDR: ":8751"
      DLNA_HTTP_ADDR: ":9750"
      DLNA_MEDIA_PATH: ${DLNA_MEDIA_PATH:-/library}
      DLNA_FRIENDLY_NAME: ${DLNA_FRIENDLY_NAME:-MuxCore DLNA}
      DLNA_PROBE_CACHE_PATH: /data/dlna/ffprobe-cache.json
    ports:
      - "${MEDIA_DLNA_HTTP_PORT:-9750}:9750"
      - "${MEDIA_DLNA_GRPC_PORT:-9751}:9751"
      - "${MEDIA_DLNA_HEALTH_PORT:-8751}:8751"
    volumes:
      - dlna-data:/data/dlna
      - library-data:/library:ro
    profiles: ["dlna"]

  # Optional content tagging / classification — compose profile: tagging
  #   docker compose --profile tagging up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_TAGGING=1
  media-tagging:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-tagging }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-tagging
      TAGGING_DATA_DIR: /data/tagging
      TAGGING_GRPC_ADDR: ":9740"
      MUXCORE_HTTP_ADDR: ":9741"
    ports:
      - "${MEDIA_TAGGING_GRPC_PORT:-9740}:9740"
      - "${MEDIA_TAGGING_HTTP_PORT:-9741}:9741"
    volumes:
      - tagging-data:/data/tagging
    profiles: ["tagging"]

  # Optional intro/outro skip detection — compose profile: intro-outro
  #   docker compose --profile intro-outro up -d
  # run-host equivalent: MVP_ENABLE_MEDIA_INTRO_OUTRO=1
  media-intro-outro:
    <<: *module
    build:
      context: ..
      dockerfile: mvp/dockerfiles/module.Dockerfile
      args: { MODULE: media-intro-outro }
    environment:
      <<: *module_env
      MUXCORE_MODULE_ID: media-intro-outro
      INTRO_OUTRO_DATA_DIR: /data/intro-outro
      MUXCORE_HTTP_ADDR: ":9711"
      INTRO_MAX_SECONDS: ${INTRO_MAX_SECONDS:-180}
      OUTRO_MAX_SECONDS: ${OUTRO_MAX_SECONDS:-240}
    ports:
      - "${MEDIA_INTRO_OUTRO_GRPC_PORT:-9710}:9710"
      - "${MEDIA_INTRO_OUTRO_HTTP_PORT:-9711}:9711"
    volumes:
      - intro-outro-data:/data/intro-outro
    profiles: ["intro-outro"]

  # Consumer SPA — media-ui-app + mediauiprox BFF (household manifest required peer)
  media-ui:
    build:
      context: ..
      dockerfile: mvp/dockerfiles/media-ui.Dockerfile
    environment:
      MOVIES_GRPC_CLIENT_ADDR: media-movies:9420
      TVSHOWS_GRPC_CLIENT_ADDR: media-tvshows:9440
      MOVIES_HTTP_URL: http://media-movies:9430
      TVSHOWS_HTTP_URL: http://media-tvshows:9450
      REQUEST_MEDIA_HTTP_URL: http://request-media:9380
      AUTH_HTTP_URL: http://auth-local:9401
      USERDATA_LOCAL_URL: http://userdata-local:9672
      TRANSCODER_HTTP_URL: http://media-transcoder:9526
      LISTSYNC_GRPC_CLIENT_ADDR: media-list-sync:9530
      GRAPH_HTTP_URL: http://media-graph:9731
      GRAPH_MODULE_TOKEN: ${GRAPH_MODULE_TOKEN:-}
      # Shared with admin-ui /password-resets queue (umbrella #111).
      MEDIA_UI_PASSWORD_RESET_FILE: /data/media-ui/password-resets.json
    ports:
      - "${MEDIA_UI_HTTP_PORT:-5173}:5173"
    volumes:
      - media-ui-data:/data/media-ui
    depends_on:
      - media-movies
      - media-tvshows
      - request-media
      - auth-local
      - userdata-local
    networks: [muxcore]
    restart: unless-stopped

networks:
  muxcore:

volumes:
  core-data:
  auth-data:
  sqlite-data:
  secrets-data:
  automation-data:
  scanner-data:
  roots-data:
  movies-data:
  tvshows-data:
  music-data:
  books-data:
  comics-data:
  audiobooks-data:
  library-data:
  downloads-data:
  jellyfin-data:
  plex-data:
  emby-data:
  request-data:
  transcoder-data:
  transcoder-pool-data:
  userdata-data:
  backup-data:
  listsync-data:
  graph-data:
  maintainer-data:
  playback-guard-data:
  playback-monitor-data:
  dlna-data:
  tagging-data:
  intro-outro-data:
  media-ui-data:
