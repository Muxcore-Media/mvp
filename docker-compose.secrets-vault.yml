# Replace the default file secrets provider. Append LAST, after the base file
# and any dev override (!reset support required; tested with Compose v2.40.3).
#
#   docker compose -f docker-compose.registry.yml -f docker-compose.secrets-vault.yml up -d
#
# Stop the old provider before switching; keep its data and identity volumes.
# A bare --profile secrets-vault is unsupported: profiles add services and
# would leave secrets-file selected too.
services:
  secrets-file: !reset null
  secrets-vault:
    profiles: !reset []
    environment:
      SECRETS_BACKEND: ${SECRETS_BACKEND:?set SECRETS_BACKEND for the selected secrets-vault provider}
