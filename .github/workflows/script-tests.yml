# Offline deploy/smoke script tests for the reference stack (ADR-0003).
# ci.yml is generated from the umbrella template; this job is mvp-specific.
name: Script tests

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: script-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Umbrella-only checks (proto drift) are skipped automatically when
      # ../scripts is absent.
      - run: bash scripts/run-script-tests.sh
      # Household install path (ADR-0007): the registry compose must parse.
      - name: Compose config
        # Required secrets have no defaults (NFR-SEC-001); CI only parses the file.
        env:
          MVP_ADMIN_PASSWORD: ci-parse-only
          HEALTH_MONITOR_HTTP_TOKEN: ci-parse-only
        run: docker compose -f docker-compose.registry.yml config -q
