# Offline deploy/smoke script tests for the reference stack (ADR-0003).
# ci.yml is generated from the umbrella template; this job is mvp-specific.
name: Script tests

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: script-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  script-tests:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Umbrella-only checks (proto drift) are skipped automatically when
      # ../scripts is absent.
      - run: bash scripts/run-script-tests.sh
      # Household and dev install paths (ADR-0007): both compose files must parse.
      - name: Compose config
        # Required secrets have no defaults (NFR-SEC-001); CI only parses the file.
        env:
          MVP_ADMIN_PASSWORD: ci-parse-only
          HEALTH_MONITOR_HTTP_TOKEN: ci-parse-only
          TRANSCODER_HTTP_TOKEN: ci-parse-only
        run: |
          enrollment_env="$(mktemp "$RUNNER_TEMP/muxcore-compose.XXXXXX.env")"
          trap 'rm -f "$enrollment_env"' EXIT
          bash scripts/gen-enrollment.sh --env-file "$enrollment_env"
          bash scripts/gen-erasure-set.sh --env-file "$enrollment_env"
          docker compose --env-file "$enrollment_env" -f docker-compose.registry.yml config -q
          docker compose --env-file "$enrollment_env" -f docker-compose.registry.yml -f docker-compose.dev.yml config -q
