# Minimal household stack — canonical module set shared by run-host.sh,
# docker-compose.registry.yml, and publish-module-images.sh.
#
# Required: always-on for a working household (library + requests + consumer UI).
# Recommended: leaf peers and metadata needed for full acquisition/scoring path.
# Optional: env-gated in run-host; omitted from registry compose by default.
#
# Version pin: MUXCORE_IMAGE_TAG / core go.mod (see scripts/bump-core-pins.sh).

version: "1"
core_tag: v0.6.7

required:
  - core                    # muxcored mesh
  - auth-local
  - database-sqlite
  - secrets-file
  - encryption-aesgcm
  - call-policy-default
  - publish-policy-default
  - health-monitor
  - admin-ui
  - media-movies
  - media-tvshows
  - media-scanner
  - media-automation
  - request-media
  - notification-default
  - media-ui                  # mediauiprox BFF + static SPA
  - userdata-local            # household progress/favorites mesh store (SQLite at USERDATA_LOCAL_DB_PATH)

recommended:
  - metadata-tmdb
  - media-custom-formats
  - media-rename
  - media-ffprobe
  - media-subtitles
  - media-root-folders

optional_env_gated:
  - name: jellyfin
    env: MVP_ENABLE_JELLYFIN
  - name: plex
    env: MVP_ENABLE_PLEX
  - name: emby
    env: MVP_ENABLE_EMBY
  - name: indexer-piratebay
    env: MVP_ENABLE_INDEXER_PIRATEBAY
  - name: indexer-torznab
    env: MVP_ENABLE_INDEXER_TORZNAB
  - name: downloader-native-torrent
    env: MVP_ENABLE_DOWNLOADER_TORRENT
  - name: downloader-native-usenet
    env: MVP_ENABLE_DOWNLOADER_USENET
  - name: downloader-qbittorrent
    env: MVP_ENABLE_DOWNLOADER_QBITTORRENT
  - name: downloader-sabnzbd
    env: MVP_ENABLE_DOWNLOADER_SABNZBD
  - name: downloader-debrid
    env: MVP_ENABLE_DOWNLOADER_DEBRID
  - name: media-transcoder
    env: MVP_ENABLE_MEDIA_TRANSCODER
  - name: media-transcoder-pool
    env: MVP_ENABLE_MEDIA_TRANSCODER_POOL
  - name: media-list-sync
    env: MVP_ENABLE_MEDIA_LIST_SYNC
  - name: media-library-maintainer
    env: MVP_ENABLE_MEDIA_LIBRARY_MAINTAINER
  - name: media-graph
    env: MVP_ENABLE_MEDIA_GRAPH
  - name: media-tagging
    env: MVP_ENABLE_MEDIA_TAGGING
  - name: ai-runtime
    env: MVP_ENABLE_AI
  - name: ai-subtitles
    env: MVP_ENABLE_AI
  - name: ai-recommend
    env: MVP_ENABLE_AI
  - name: ai-tickets
    env: MVP_ENABLE_AI
  - name: ai-filter
    env: MVP_ENABLE_AI
  - name: ai-librarian
    env: MVP_ENABLE_AI
  - name: media-intro-outro
    env: MVP_ENABLE_MEDIA_INTRO_OUTRO
  - name: media-dlna
    env: MVP_ENABLE_MEDIA_DLNA
  - name: media-books
    env: MVP_ENABLE_MEDIA_BOOKS
  - name: media-comics
    env: MVP_ENABLE_MEDIA_COMICS
  - name: media-audiobooks
    env: MVP_ENABLE_MEDIA_AUDIOBOOKS
  - name: notification-apprise
    env: MVP_ENABLE_NOTIFICATION_APPRISE
  - name: playback-guard
    env: MVP_ENABLE_PLAYBACK_GUARD
  - name: playback-monitor
