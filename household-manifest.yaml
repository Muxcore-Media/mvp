# State model (ADR-0013, FR-BAK-002). Source of truth for which module owns which
# durable state in docker-compose.registry.yml; scripts/check-state-coverage.sh
# enforces it. Per module:
#   service   compose service name (default: module name)
#   volume    named volume holding the state; mount = its path in the container
#   env       env vars (compose `environment`) that point into the mount
#   kind      sqlite | files | json
#   personal  true when it holds household personal data (accounts, history, requests)
#   backup    default true: backup-local mounts the volume read-only at
#             /source/<module-id> and lists it in default BACKUP_SOURCE_DIRS.
#             false: volume must be in excluded_volumes (e.g. key material).
#   shares    (optional) other state volumes this service also mounts; owned elsewhere
#   host      (optional) host-mode state directory under run-host.sh's data/ (single
#             path segment). Several modules may share one (admin-ui and media-ui
#             both use data/media-ui). Omitted when run-host keeps no state for it.
#             backup-local archives each host dir as data/<basename> (run-host
#             BACKUP_SOURCE_DIRS); scripts/restore-drill.sh and docs/RESTORE.md map
#             archive entries back with it (FR-BAK-004).
# Every required/recommended module is in `state` or `stateless` (error otherwise);
# optional modules are checked too but drift only warns.
state:
  core:
    volume: core-data
    mount: /app/data
    host: storage
    env: {MUXCORE_STORAGE_DIR: /app/data/storage}
    kind: files
    personal: false
  auth-local:
    volume: auth-data
    mount: /data
    host: auth
    env: {AUTH_DB_PATH: /data/auth.db}
    kind: sqlite
    personal: true
    notes: household accounts, password hashes, sessions
  database-sqlite:
    volume: sqlite-data
    mount: /data
    host: sqlite
    env: {SQLITE_DB_PATH: /data/muxcore.db}
    kind: sqlite
    personal: true
    notes: shared mesh database capability; may hold rows from any module
  secrets-file:
    volume: secrets-file-data
    mount: /data
    host: secrets
    env: {SECRETS_STORE: /data/secrets.json}
    kind: json
    personal: false
    notes: >-
      AES-GCM encrypted store. SECRETS_MASTER_KEY (compose env, 64 hex chars) must be
      kept OUTSIDE the backup archive (operator .env / password manager); a restored
      secrets.json is unreadable without it. Unset key = fail closed at Init.
  encryption-aesgcm:
    volume: encryption-aesgcm-data
    mount: /data
    host: encryption
    env: {ENCRYPTION_KEY_FILE: /data/master.key}
    kind: files
    personal: false
    backup: false
    notes: generated AES keyring (key material); export/escrow it separately, never in the archive
  admin-ui:
    volume: admin-ui-data
    mount: /data
    host: media-ui
    env: {ADMIN_UI_DATA_DIR: /data}
    kind: json
    personal: true
    shares: [media-ui-data]
    notes: branding, networking, parental, sessions, spool trust; also mounts media-ui-data for the shared password-reset queue
  media-movies:
    volume: media-movies-data
    mount: /data
    host: movies
    env: {MOVIES_DB_PATH: /data/movies.db, MOVIES_IMAGE_DIR: /data/images}
    kind: sqlite
    personal: false
  media-tvshows:
    volume: media-tvshows-data
    mount: /data
    host: tvshows
    env: {TVSHOWS_DB_PATH: /data/tvshows.db, TVSHOWS_IMAGE_DIR: /data/images}
    kind: sqlite
    personal: false
  media-scanner:
    volume: media-scanner-data
    mount: /data
    host: scanner
    env: {SCANNER_DB_PATH: /data/scanner.db}
    kind: sqlite
    personal: false
  media-automation:
    volume: media-automation-data
    mount: /data
    host: automation
    env: {AUTOMATION_DB_PATH: /data/automation.db}
    kind: sqlite
    personal: false
  request-media:
    volume: request-media-data
    mount: /data
    host: request
    env: {REQUEST_DATA_DIR: /data}
    kind: sqlite
    personal: true
    notes: requests.db + request-policy.json; who asked for what
  userdata-local:
    volume: userdata-data
    mount: /data
    host: userdata
    env: {USERDATA_LOCAL_DB_PATH: /data/userdata.db}
    kind: sqlite
    personal: true
    notes: watch progress, favorites, preferences
  media-ui:
    volume: media-ui-data
    mount: /data/media-ui
    host: media-ui
    env:
      MEDIA_UI_USERDATA_DIR: /data/media-ui
      MEDIA_UI_PASSWORD_RESET_FILE: /data/media-ui/password-resets.json
    kind: json
    personal: true
    notes: BFF playback policy, livetv, library paths, password-reset queue (shared with admin-ui)
  media-custom-formats:
    volume: media-custom-formats-data
    mount: /data
    host: formats
    env: {FORMATS_DB_PATH: /data/formats.db}
    kind: sqlite
    personal: false
  media-rename:
    volume: media-rename-data
    mount: /data
    host: rename
    env: {RENAME_DB_PATH: /data/rename.db}
    kind: sqlite
    personal: false
  media-ffprobe:
    volume: media-ffprobe-data
    mount: /data
    host: ffprobe
    env: {FFPROBE_DB_PATH: /data/cache.db}
    kind: sqlite
    personal: false
    notes: probe cache; rebuildable but cheap to keep
  media-subtitles:
    volume: media-subtitles-data
    mount: /data
    host: subtitles
    env: {SUBS_DB_PATH: /data/subtitles.db, SUBS_DIR: /data/files}
    kind: sqlite
    personal: false
  media-root-folders:
    volume: media-root-folders-data
    mount: /data
    host: roots
    env: {ROOTS_DB_PATH: /data/roots.db}
    kind: sqlite
    personal: false
  # Optional (compose profiles) — drift only warns.
  auth-oidc:
    volume: auth-oidc-data
    mount: /data
    host: auth-oidc
    env: {AUTH_OIDC_DB_PATH: /data/auth-oidc/auth.db}
    kind: sqlite
    personal: true
  playback-guard:
    volume: playback-guard-data
    mount: /data/playback-guard
    host: playback-guard
    env: {PLAYBACK_GUARD_DB_PATH: /data/playback-guard/guard.db}
    kind: sqlite
    personal: true
  playback-monitor:
    volume: playback-monitor-data
    mount: /data/playback-monitor
    host: playback-monitor
    env: {PLAYBACK_MONITOR_DB_PATH: /data/playback-monitor/monitor.db}
    kind: sqlite
    personal: true
  media-dlna:
    volume: dlna-data
    mount: /data/dlna
    host: dlna
    env: {DLNA_PROBE_CACHE_PATH: /data/dlna/ffprobe-cache.json}
    kind: json
    personal: false
  media-tagging:
    volume: tagging-data
    mount: /data/tagging
    host: tagging
    env: {TAGGING_DATA_DIR: /data/tagging}
    kind: files
    personal: false
  media-intro-outro:
    volume: intro-outro-data
    mount: /data/intro-outro
    host: intro-outro
    env: {INTRO_OUTRO_DATA_DIR: /data/intro-outro}
    kind: files
    personal: false
  media-transcoder-pool:
    volume: transcoder-pool-data
    mount: /data/transcoder-pool
    host: transcoder-pool
    env: {POOL_DB_PATH: /data/transcoder-pool/pool.db}
    kind: sqlite
    personal: false
  jellyfin:
    service: jellyfin-bridge
    volume: jellyfin-data
    mount: /data
    host: jellyfin
    env: {JELLYFIN_DATA_DIR: /data/jellyfin}
    kind: files
    personal: true
  plex:
    service: plex-bridge
    volume: plex-data
    mount: /data
    env: {PLEX_DATA_DIR: /data/plex}
    kind: files
    personal: true
  emby:
    service: emby-bridge
    volume: emby-data
    mount: /data
    env: {EMBY_DATA_DIR: /data/emby}
    kind: files
    personal: true

# Required/recommended modules with no durable state (config/env only, in-memory caches).
stateless:
  - call-policy-default
  - publish-policy-default    # PUBLISH_POLICY_AUDIT_PATH unset (audit off)
  - health-monitor
  - notification-default
  - metadata-tmdb             # in-memory TMDB cache only

# Volumes that are deliberately NOT in the backup archive.
excluded_volumes:
  - volume: movies
    reason: library media (user content), not module state; back up with your own media strategy
  - volume: shows
    reason: library media (user content), not module state
  - volume: downloads
    reason: transient acquisition staging; re-fetchable
  - volume: encryption-aesgcm-data
    reason: key material; keep out of the archive and escrow separately
  - volume: backup-data
    reason: backup-local output (archives themselves)
  - volume: backup-restore-data
    reason: backup-local restore staging area

contract_deps:
  - github.com/Muxcore-Media/contracts-scanner@v0.1.0
  - github.com/Muxcore-Media/contracts-automation@v0.1.0
  - github.com/Muxcore-Media/contracts-metadata@v0.1.0
  - github.com/Muxcore-Media/contracts-media@v0.1.0
  - github.com/Muxcore-Media/contracts-ai@v0.1.0
